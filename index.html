};

function normalizePlayer(player, index) {
  if (typeof player === "string") {
    return {
      name: player.trim(), number: index + 1, position: "",
      photo:"", birthDate:"", guardian:"", phone:"", email:""
    };
  }
  if (!player || typeof player !== "object") return null;
  return {
    name: String(player.name || "").trim(),
    number: Number.isFinite(Number(player.number)) ? Number(player.number) : index + 1,
    position: String(player.position || "").trim(),
    photo: String(player.photo || ""),
    birthDate: String(player.birthDate || ""),
    guardian: String(player.guardian || ""),
    phone: String(player.phone || ""),
    email: String(player.email || "")
  };
}

function normalizeTeam(teamName, value) {
  const name = String(teamName || "").trim().toUpperCase();
  if (!name) return null;
  if (Array.isArray(value)) {
    return { name, coach:"", assistant:"", season:"2026/2027", notes:"", players:value.map(normalizePlayer).filter(Boolean), events:[] };
  }
  if (!value || typeof value !== "object") return null;
  const rawPlayers = Array.isArray(value.players) ? value.players : [];
  const rawEvents = Array.isArray(value.events) ? value.events : [];
  return {
    name,
    coach:String(value.coach || "").trim(),
    assistant:String(value.assistant || "").trim(),
    season:String(value.season || "2026/2027").trim(),
    notes:String(value.notes || "").trim(),
    players:rawPlayers.map(normalizePlayer).filter(p => p && p.name),
    events:rawEvents.map((event, i) => ({
      id:String(event.id || `${name}-${i}-${Date.now()}`),
      type:event.type === "match" ? "match" : "training",
      name:String(event.name || "").trim(),
      date:String(event.date || ""),
      time:String(event.time || ""),
      location:String(event.location || "").trim(),
      opponent:String(event.opponent || "").trim()
    }))
  };
}

function normalizeTeams(raw) {
  const result = {};
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return result;
  Object.entries(raw).forEach(([teamName, value]) => {
    const team = normalizeTeam(teamName, value);
    if (team) result[team.name] = team;
  });
  return result;
}

function loadTeams() {
  const saved = storage.get("cgTeams", "");
  if (saved) {
    try {
      const parsed = normalizeTeams(JSON.parse(saved));
      if (Object.keys(parsed).length) return parsed;
    } catch (_) {}
  }

  const legacy = storage.get("cgPlayers", "");
  const raw = structuredClone(DEFAULT_TEAMS);
  if (legacy) {
    try {
      const oldPlayers = JSON.parse(legacy);
      if (Array.isArray(oldPlayers) && oldPlayers.length) raw.U9 = oldPlayers;
    } catch (_) {}
  }
  return normalizeTeams(raw);
}

function currentTeam() {
  return teams[selectedTeam] || {name:selectedTeam,coach:"",assistant:"",season:"2026/2027",notes:"",players:[],events:[]};
}

function syncCurrentTeam() {
  if (!teams[selectedTeam]) return;
  teams[selectedTeam].players = players;
}

function t(key) {
  return T[lang]?.[key] ?? T.pt[key] ?? key;
}

function persistTeams() {
  syncCurrentTeam();
  storage.set("cgTeams", JSON.stringify(teams));
  storage.set("cgSelectedTeam", selectedTeam);
}

function selectTeam(value) {
  persistTeams();
  const next = String(value || "").toUpperCase();

  render();
}

function setRole(value) {

}

function initials(name) {
  const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
  return parts.slice(0,2).map(x => x[0].toUpperCase()).join("") || "??";
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[ch]));
}

function attendanceKey(team, name) {

function isPresent(team, name) {

function go(id) {

  if (navId && $(`n-${navId}`)) $(`n-${navId}`).classList.add("active");
  render();
}

const WEEK_DAYS = [
  ['1','Seg','Segunda'],['2','Ter','Terça'],['3','Qua','Quarta'],
  ['4','Qui','Quinta'],['5','Sex','Sexta'],['6','Sáb','Sábado'],['0','Dom','Domingo']

function getWeeklyTrainingConfig(team){
  team.weeklyTrainings = team.weeklyTrainings || {count:2,days:['2','4'],time:'18:30',location:''};

function saveWeeklyTrainings(){
  const team=typeof getSelectedTeam==='function'?getSelectedTeam():null;
  if(!team)return;
  const count=Number(document.getElementById('weeklyTrainingCount')?.value||2);
  const days=[...document.querySelectorAll('#weeklyTrainingDays input:checked')].map(x=>x.value);
  if(days.length!==count){

    return;
  }
  team.weeklyTrainings={
    count,days,
    time:document.getElementById('weeklyTrainingTime')?.value||'18:30',
    location:document.getElementById('weeklyTrainingLocation')?.value||''
  };
  // Create/update the recurring training templates, without duplicating them.
  team.events=(team.events||[]).filter(e=>!e.recurringWeekly);
  const dayNames=Object.fromEntries(WEEK_DAYS.map(([v,,long])=>[v,long]));
  days.forEach((day,i)=>{
    team.events.push({
      id:'weekly-'+day,
      type:'training',
      name:`Treino ${dayNames[day]}`,
      date:'',
      time:team.weeklyTrainings.time,
      location:team.weeklyTrainings.location,
      opponent:'',
      recurringWeekly:true,
      weekday:day
    });
  });
  if(typeof saveTeams==='function')saveTeams();
  if(typeof renderTeamPage==='function')renderTeamPage();
  if(typeof toast==='function')toast(`Treinos semanais guardados: ${count}x por semana.`);
}


function dateKeyUTC(d){
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
}
function startOfTodayUTC(){
  const n=new Date();
  return new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()));
}
function generateRecurringTrainings(){
  const team=typeof getSelectedTeam==='function'?getSelectedTeam():null;
  if(!team)return;
  const cfg=getWeeklyTrainingConfig(team);
  const weeks=Math.min(12,Math.max(1,Number(document.getElementById('generateWeeks')?.value||4)));
  const selectedDays=(cfg.days||[]).map(Number);
  if(!selectedDays.length){
    if(typeof toast==='function')toast('Define primeiro os dias dos treinos semanais.');
    return;
  }
  const today=startOfTodayUTC();
  const end=new Date(today); end.setUTCDate(end.getUTCDate()+weeks*7);
  team.events=(team.events||[]).filter(e=>!e.generatedWeekly);
  const names=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  let created=0;
  for(let d=new Date(today);d<=end;d.setUTCDate(d.getUTCDate()+1)){
    if(!selectedDays.includes(d.getUTCDay()))continue;
    const key=dateKeyUTC(d);
    const exists=(team.events||[]).some(e=>e.date===key && e.type==='training' && e.generatedWeekly);
    if(exists)continue;
    team.events.push({
      id:'gen-'+key,
      type:'training',
      name:`Treino ${names[d.getUTCDay()]}`,
      date:key,
      time:cfg.time||'18:30',
      location:cfg.location||'',
      opponent:'',
      generatedWeekly:true,
      recurringWeekly:true,
      weekday:String(d.getUTCDay())
    });
    created++;
  }
  if(typeof saveTeams==='function')saveTeams();
  if(typeof renderTeamPage==='function')renderTeamPage();
  if(typeof toast==='function')toast(`${created} treinos adicionados ao calendário.`);
}

function renderParentWeek(){

  const role=typeof currentRole!=='undefined'?currentRole:null;
  if(role && role!=='parent'){card.style.display='none';return;}
  card.style.display='';
  const team=parentWeekTeam();
  if(!team){wrap.innerHTML='<p class="muted">Nenhuma equipa selecionada.</p>';return;}

  const player=(team.players||[])[0] || {name:'Lucas Ferreira',photo:'',number:'',position:''};
  const profileName=document.getElementById('parentChildName');
  const profileTeam=document.getElementById('parentChildTeam');
  const img=document.getElementById('parentChildPhoto');
  const initials=document.getElementById('parentChildInitials');
  if(profileName)profileName.textContent=player.name||'Lucas Ferreira';
  if(profileTeam)profileTeam.textContent=`${team.name||'Equipa'}${player.number?' · #'+player.number:''}${player.position?' · '+player.position:''}`;

    else {img.style.display='none';if(initials){initials.style.display='flex';initials.textContent=(player.name||'LF').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();}}
  }

  const cfg=getWeeklyTrainingConfig(team);
  const dayMap={0:'Dom',1:'Seg',2:'Ter',3:'Qua',4:'Qui',5:'Sex',6:'Sáb'};
  const now=new Date(); now.setHours(0,0,0,0);
  const monday=new Date(now); const dow=monday.getDay(); monday.setDate(monday.getDate()-(dow===0?6:dow-1));

  const week=[];
  for(let i=0;i<7;i++){
    const d=new Date(monday); d.setDate(monday.getDate()+i);
    const key=d.toISOString().slice(0,10);
    let event=(team.events||[]).find(e=>e.date===key && e.type==='match') ||
              (team.events||[]).find(e=>e.date===key && e.type==='training');
    const weekday=String(d.getDay());
    if(!event && (cfg.days||[]).includes(weekday)){
      event={id:`planned-${key}`,type:'training',date:key,time:cfg.time||'18:30',location:cfg.location||'',name:'Treino'};
    }
    week.push({d,key,event});
  }

  wrap.innerHTML=`<div class="week-calendar">
    <div class="calendar-title"><strong>Esta semana</strong><span class="muted">Toca num dia para responder</span></div>
    <div class="calendar-days">${week.map(({d,key,event})=>{
      const value=localStorage.getItem('cgParentAvailability_'+team.name+'_'+key)||'';
      const isToday=d.getTime()===now.getTime();
      return `<div class="calendar-day ${isToday?'today':''} ${event?'has-event':''}" onclick="openParentDay('${key}')">
        <small>${dayMap[d.getDay()]}</small><b>${d.getDate()}</b>
        ${event?`<span class="day-event">${event.type==='match'?'⚽':'🏃'} ${event.time||''}</span>`:'<span class="day-empty">—</span>'}
        ${value==='yes'?'<em>✓</em>':value==='no'?'<em>×</em>':''}
      </div>`;
    }).join('')}</div>
    <div id="parentDayDetails" class="parent-day-details"></div>
  </div>`;
  const first=week.find(x=>x.event);
  if(first)openParentDay(first.key);
  else document.getElementById('parentDayDetails').innerHTML='<p class="muted">Não há treinos ou jogos definidos para esta semana.</p>';
}
function openParentDay(key){
  const team=parentWeekTeam(); const box=document.getElementById('parentDayDetails');
  if(!team||!box)return;
  const event=(team.events||[]).find(e=>e.date===key && (e.type==='match'||e.type==='training'));
  const cfg=getWeeklyTrainingConfig(team);
  const planned=!event && (cfg.days||[]).includes(String(new Date(key+'T00:00:00').getDay()));
  if(!event&&!planned){box.innerHTML='<p class="muted">Dia sem atividade.</p>';return;}
  const e=event||{id:'planned-'+key,type:'training',name:'Treino',time:cfg.time||'18:30',location:cfg.location||''};
  const storageKey='cgParentAvailability_'+team.name+'_'+key;
  const value=localStorage.getItem(storageKey)||'';
  box.innerHTML=`<div class="parent-activity">
    <div><strong>${e.type==='match'?'⚽ Jogo':'🏃 Treino'} · ${formatShortDate(key)}</strong>
    <small>${e.time||'—'}${e.location?' · '+e.location:''}${e.opponent?' · '+e.opponent:''}</small></div>
    <div class="attendance-actions">
      <button type="button" class="${value==='yes'?'active':''}" onclick="setParentAvailability('${storageKey}','yes',this);markParentCalendar('${key}','yes')">Vou</button>
      <button type="button" class="${value==='no'?'active':''}" onclick="setParentAvailability('${storageKey}','no',this);markParentCalendar('${key}','no')">Não vou</button>
    </div>
  </div>`;
}
function markParentCalendar(key,value){
  document.querySelectorAll('.calendar-day').forEach(day=>{
    if(day.getAttribute('onclick')===`openParentDay('${key}')`){
      let em=day.querySelector('em'); if(!em){em=document.createElement('em');day.appendChild(em);}
      em.textContent=value==='yes'?'✓':'×';
    }
  });
}

function setParentAvailability(key,value,button){
  localStorage.setItem(key,value);
  const parent=button.parentElement;
  parent.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
  button.classList.add('active');
  if(typeof toast==='function')toast(value==='yes'?'Presença registada.':'Indisponibilidade registada.');
}


function isCoachOrAdmin(){
  const role=typeof currentRole!=='undefined'?currentRole:null;
  return role==='coach'||role==='admin';
}
function openCoachTeam(){
  if(typeof showTeamPage==='function'){
    showTeamPage();
    setTimeout(function(){
      const t=typeof getSelectedTeam==='function'?getSelectedTeam():null;
      if(t){if(typeof renderCoachTeamStatus==='function')renderCoachTeamStatus(t);if(typeof renderCoachConvocation==='function')renderCoachConvocation(t);if(typeof renderCoachMatchManagement==='function')renderCoachMatchManagement(t);if(typeof renderCoachTrainingPanel==='function')renderCoachTrainingPanel(t);if(typeof renderTeamQuickStats==='function')renderTeamQuickStats(t);if(typeof renderPlayerAdminTools==='function')renderPlayerAdminTools();}
    },50);
  }
}
function getPlayerAvailabilityForTeam(team,player){
  const prefix='cgParentAvailability_'+team.name+'_';
  const keys=[];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.startsWith(prefix))keys.push(k);
    }
  }catch(e){}
  let yes=0,no=0,pending=0;
  keys.forEach(k=>{const v=localStorage.getItem(k); if(v==='yes')yes++; else if(v==='no')no++;});
  // Prototype has one parent availability stream; keep player status simple until parent-child accounts exist.
  if(yes) return 'Disponível';
  if(no) return 'Indisponível';
  return 'Sem resposta';
}
function updateCoachHome(){
  const card=document.getElementById('coachTeamCard');
  if(!card)return;
  if(!isCoachOrAdmin()){card.style.display='none';return;}
  card.style.display='';
  const team=typeof getSelectedTeam==='function'?getSelectedTeam():null;
  if(!team)return;
  const players=team.players||[];
  const count=document.getElementById('coachPlayerCount');
  const name=document.getElementById('coachTeamName');
  const available=document.getElementById('coachAvailableCount');
  if(name)name.textContent=team.name||'Equipa';
  if(count)count.textContent=String(players.length);
  let availableCount=0;
  players.forEach(p=>{if(getPlayerAvailabilityForTeam(team,p)==='Disponível')availableCount++;});
  if(available)available.textContent=String(availableCount);
}
function renderCoachTeamStatus(team){
  if(!isCoachOrAdmin()||!team)return;
  const container=document.getElementById('teamAttendance');
  if(!container)return;
  let box=document.getElementById('coachAvailabilityPanel');
  if(!box){
    box=document.createElement('div');box.id='coachAvailabilityPanel';box.className='card';box.style.marginTop='12px';
    container.parentNode.insertBefore(box,container);
  }

  const cfg=getWeeklyTrainingConfig(team);
  const today=new Date(); today.setHours(0,0,0,0);
  const monday=new Date(today);
  const dow=monday.getDay();
  monday.setDate(monday.getDate()-(dow===0?6:dow-1));
  const cols=[];
  for(let i=0;i<7;i++){
    const d=new Date(monday);d.setDate(monday.getDate()+i);
    const key=d.toISOString().slice(0,10);
    const real=(team.events||[]).find(e=>e.date===key&&(e.type==='match'||e.type==='training'));
    const isTraining=!real&&(cfg.days||[]).includes(String(d.getDay()));
    if(real||isTraining)cols.push({key,d,event:real||{type:'training',name:'Treino',time:cfg.time||'18:30'}});
  }
  const dayNames=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const players=team.players||[];
  const nextMatch=(team.events||[]).filter(e=>e.type==='match'&&e.date&&new Date(e.date+'T00:00:00')>=today).sort((a,b)=>a.date.localeCompare(b.date))[0];

  box.innerHTML=`<div class="section-head"><div><h3>📋 Presenças da equipa</h3><p class="muted">Clica numa célula para alternar Presente / Absent.</p></div></div>
  ${nextMatch?`<div class="coach-next-match"><strong>⚽ Próximo jogo: ${formatShortDate(nextMatch.date)}</strong><div class="muted">${nextMatch.time||'—'}${nextMatch.opponent?' · '+nextMatch.opponent:''}</div></div>`:''}
  <div class="coach-attendance-table-wrap"><table class="coach-attendance-table">
  <thead><tr><th>Jogador</th>${cols.map(c=>`<th>${dayNames[c.d.getDay()]} ${c.d.getDate()}<br><small>${c.event.type==='match'?'⚽ Jogo':'🏃 Treino'}</small></th>`).join('')}</tr></thead>
  <tbody>${players.map((pl,pi)=>`<tr><td><strong>${pl.name||'Jogador'}</strong>${pl.number?' · #'+pl.number:''}</td>
  ${cols.map(c=>{
    const v=(pl.attendance||{})[c.key];
    const text=v===true||v==='present'?'Presente':v===false||v==='absent'?'Absent':'—';
    const cls=text==='Presente'?'att-present':text==='Absent'?'att-absent':'att-pending';
    return `<td><span class="att-cell ${cls}" onclick="toggleCoachAttendance('${team.name.replace(/'/g,"\\'")}','${pi}','${c.key}')">${text}</span></td>`;
  }).join('')}</tr>`).join('')}</tbody></table></div>
  <div class="coach-table-note">Presente → Absent → —</div>`;
}
function toggleCoachAttendance(teamName,playerIndex,dateKey){
  const teams=typeof getTeams==='function'?getTeams():[];
  const team=teams.find(t=>t.name===teamName);
  if(!team||!team.players||!team.players[playerIndex])return;
  const pl=team.players[playerIndex];
  pl.attendance=pl.attendance||{};
  const v=pl.attendance[dateKey];
  pl.attendance[dateKey]=v===true||v==='present'?false:v===false||v==='absent'?null:true;
  if(pl.attendance[dateKey]===null)delete pl.attendance[dateKey];
  if(typeof saveTeams==='function')saveTeams();
  renderCoachTeamStatus(team);
  if(typeof toast==='function')toast(pl.attendance[dateKey]===true?'Presença marcada.':pl.attendance[dateKey]===false?'Falta marcada.':'Registo limpo.');
}

function populateCoachTeamSelect(){
  const sel=document.getElementById('coachTeamSelect');
  if(!sel||typeof getTeams!=='function')return;
  const teams=getTeams();
  const current=typeof getSelectedTeam==='function'?getSelectedTeam():null;
  sel.innerHTML=teams.map(t=>`<option value="${String(t.name).replace(/"/g,'&quot;')}">${t.name}</option>`).join('');
  if(current)sel.value=current.name;
}
function selectCoachTeam(name){
  if(typeof setSelectedTeam==='function')setSelectedTeam(name);
  else localStorage.setItem('cgSelectedTeam',name);
  if(typeof updateCoachHome==='function')updateCoachHome();
  const team=typeof getSelectedTeam==='function'?getSelectedTeam():null;
  if(team&&typeof renderCoachTeamStatus==='function')renderCoachTeamStatus(team);
  if(typeof toast==='function')toast(`Equipa: ${name}`);
}


function getNextMatch(team){
  if(!team)return null;
  const today=new Date();today.setHours(0,0,0,0);
  return (team.events||[]).filter(e=>e.type==='match'&&e.date&&new Date(e.date+'T00:00:00')>=today)
    .sort((a,b)=>a.date.localeCompare(b.date))[0]||null;
}
function renderCoachConvocation(team){
  const box=document.getElementById('coachConvocationContent');
  if(!box||!isCoachOrAdmin()||!team)return;
  const game=getNextMatch(team), players=team.players||[];
  if(!game){box.innerHTML='<p class="muted">Cria primeiro um jogo para fazer a convocatória.</p>';return;}
  game.convocation=game.convocation||[];
  const selected=new Set(game.convocation); game.parentConfirmations=game.parentConfirmations||{};
  box.innerHTML=`<div class="convocation-top">
    <div class="convocation-count"><small>Próximo jogo</small><br><strong>${formatShortDate(game.date)} · ${game.time||'—'}</strong>${game.opponent?`<br><small>${game.opponent}</small>`:''}</div>
    <div class="convocation-count"><small>Convocados</small><br><strong id="convocationSelectedCount">${selected.size}</strong></div>
  </div>
  <div class="confirmed-count">Confirmações dos pais aparecem aqui depois de responderem.</div><div class="convocation-list">${players.map((pl,i)=>`<div class="convocation-player ${selected.has(i)?'selected':''}">
    <label><input type="checkbox" ${selected.has(i)?'checked':''} onchange="toggleConvocation(${i},this.checked)"><strong>${pl.name||'Jogador'}</strong>${pl.number?' · #'+pl.number:''}</label>
    <span class="convocation-status">${selected.has(i)?(game.parentConfirmations[String(i)]==='yes'?'Pai confirmou':game.parentConfirmations[String(i)]==='no'?'Pai não pode':'Aguarda pai'):getPlayerAvailabilityForTeam(team,pl)}</span>
  </div>`).join('')}</div>
  <button type="button" class="btn primary" style="margin-top:10px" onclick="saveConvocation()">💾 Guardar convocatória</button>`;
}
function toggleConvocation(index,checked){
  const team=typeof getSelectedTeam==='function'?getSelectedTeam():null;
  const game=getNextMatch(team);if(!game)return;
  game.convocation=game.convocation||[];
  if(checked&&!game.convocation.includes(index))game.convocation.push(index);
  if(!checked)game.convocation=game.convocation.filter(i=>i!==index);
  const c=document.getElementById('convocationSelectedCount');if(c)c.textContent=game.convocation.length;
  const row=document.querySelectorAll('.convocation-player')[index];if(row)row.classList.toggle('selected',checked);
}
function saveConvocation(){
  const team=typeof getSelectedTeam==='function'?getSelectedTeam():null;
  if(!team)return;
  if(typeof saveTeams==='function')saveTeams();
  renderCoachConvocation(team);renderCoachMatchManagement(team);
  if(typeof renderParentConvocation==='function')renderParentConvocation(team);
  if(typeof toast==='function')toast('Convocatória guardada.');
}
function renderParentConvocation(team){
  const box=document.getElementById('parentConvocationContent');
  if(!box||!team)return;
  const game=getNextMatch(team);
  const player=(team.players||[])[0];
  if(!game||!player){box.innerHTML='';return;}
  const convocated=(game.convocation||[]).includes(0);
  if(!convocated){
    box.innerHTML=`<div class="coach-next-match"><strong>⚽ Próximo jogo · ${formatShortDate(game.date)}</strong>
      <div class="muted">${game.time||'—'}${game.opponent?' · '+game.opponent:''}</div>
      <div style="margin-top:7px"><strong>${player.name||'O teu filho'} não está convocado.</strong></div></div>`;
    return;
  }
  game.parentConfirmations=game.parentConfirmations||{};
  const status=game.parentConfirmations['0']||'';
  box.innerHTML=`<div class="convocation-confirm">
    <strong>⚽ ${player.name||'O teu filho'} está ✅ CONVOCADO</strong>
    <div class="muted">${formatShortDate(game.date)} · ${game.time||'—'}${game.opponent?' · '+game.opponent:''}</div>
    <div style="margin-top:7px;font-size:12px">Vais levar o teu filho ao jogo?</div>
    <div class="confirm-buttons">
      <button type="button" class="btn ${status==='yes'?'primary':''}" onclick="confirmGameAttendance('yes')">✅ Vou</button>
      <button type="button" class="btn ${status==='no'?'primary':''}" onclick="confirmGameAttendance('no')">❌ Não vou</button>
    </div>
    <div class="confirmed-count">${status==='yes'?'Presença confirmada.':status==='no'?'Indisponibilidade comunicada.':'Ainda não respondeste.'}</div>
  </div>`;
}
function confirmGameAttendance(value){
  const team=typeof getSelectedTeam==='function'?getSelectedTeam():null;
  const game=getNextMatch(team);
  if(!team||!game)return;
  game.parentConfirmations=game.parentConfirmations||{};
  game.parentConfirmations['0']=value;
  if(typeof saveTeams==='function')saveTeams();
  renderParentConvocation(team);
  if(typeof toast==='function')toast(value==='yes'?'Presença no jogo confirmada.':'Indisponibilidade comunicada.');
}

function renderCoachMatchManagement(team){
  const box=document.getElementById('coachMatchManagementContent');
  const panel=document.getElementById('coachMatchManagement');
  if(!box||!panel)return;
  if(!isCoachOrAdmin()){panel.style.display='none';return;}
  panel.style.display='';
  const game=getNextMatch(team);
  if(!game){box.innerHTML='<p class="muted">Ainda não há próximo jogo.</p>';return;}
  const players=team.players||[], conv=game.convocation||[], conf=game.parentConfirmations||{};
  const confirmed=conv.filter(i=>conf[String(i)]==='yes').length;
  const declined=conv.filter(i=>conf[String(i)]==='no').length;
  const waiting=conv.length-confirmed-declined;
  box.innerHTML=`<div class="match-management-grid">
    <div class="match-management-stat"><small>Convocados</small><strong>${conv.length}</strong></div>
    <div class="match-management-stat"><small>Confirmaram</small><strong>${confirmed}</strong></div>
    <div class="match-management-stat"><small>Não podem</small><strong>${declined}</strong></div>
    <div class="match-management-stat"><small>A aguardar</small><strong>${waiting}</strong></div>
  </div>
  <div class="match-confirm-list">${conv.map(i=>{
    const pl=players[i]||{name:'Jogador'};
    const v=conf[String(i)]||'';
    const label=v==='yes'?'Pai confirmou':v==='no'?'Pai não pode':'Aguarda pai';
    return `<div class="match-confirm-row"><span><strong>${pl.name}</strong>${pl.number?' · #'+pl.number:''}<br><small>${label}</small></span><span class="match-confirm-pill">${v==='yes'?'✅':v==='no'?'❌':'⏳'}</span></div>`;
  }).join('')}</div>`;
}


function getUpcomingTrainings(team){
  const today=new Date();today.setHours(0,0,0,0);
  const cfg=getWeeklyTrainingConfig(team);
  const arr=[];
  for(let i=0;i<14;i++){
    const d=new Date(today);d.setDate(today.getDate()+i);
    const key=d.toISOString().slice(0,10);
    const real=(team.events||[]).find(e=>e.date===key&&e.type==='training');
    if(real|| (cfg.days||[]).includes(String(d.getDay()))){
      arr.push({key,d,event:real||{type:'training',name:'Treino',time:cfg.time||'18:30',location:cfg.location||''}});
    }
  }
  return arr.slice(0,6);
}
function renderCoachTrainingPanel(team){
  const box=document.getElementById('coachTrainingContent'), panel=document.getElementById('coachTrainingPanel');
  if(!box||!panel)return;
  if(!isCoachOrAdmin()){panel.style.display='none';return;}
  panel.style.display='';
  const trainings=getUpcomingTrainings(team);
  if(!trainings.length){box.innerHTML='<p class="muted">Não há treinos definidos.</p>';return;}
  const selected=window._coachTrainingDate||trainings[0].key;
  box.innerHTML=`<div class="training-picker">${trainings.map(t=>`<button type="button" class="${t.key===selected?'active':''}" onclick="selectCoachTraining('${t.key}')">${formatShortDate(t.key)}</button>`).join('')}</div>
  <div id="selectedTrainingAttendance"></div>`;
  renderSelectedTrainingAttendance(team,selected);
}
function selectCoachTraining(key){
  window._coachTrainingDate=key;
  const team=typeof getSelectedTeam==='function'?getSelectedTeam():null;
  if(team)renderCoachTrainingPanel(team);
}
function renderSelectedTrainingAttendance(team,key){
  const box=document.getElementById('selectedTrainingAttendance');if(!box)return;
  const players=team.players||[];
  let present=0,absent=0;
  box.innerHTML=`<div class="training-att-list">${players.map((pl,i)=>{
    const v=(pl.attendance||{})[key];
    if(v===true||v==='present')present++; if(v===false||v==='absent')absent++;
    const text=v===true||v==='present'?'Presente':v===false||v==='absent'?'Absent':'—';
    return `<div class="training-att-row"><span><strong>${pl.name||'Jogador'}</strong>${pl.number?' · #'+pl.number:''}</span><div class="training-att-actions">
      <button type="button" class="${text==='Presente'?'active':''}" onclick="setTrainingAttendance(${i},'${key}',true)">✓</button>
      <button type="button" class="${text==='Absent'?'active':''}" onclick="setTrainingAttendance(${i},'${key}',false)">✕</button>
    </div></div>`;
  }).join('')}</div>
  <div class="coach-table-note">Presentes: ${present} · Faltas: ${absent} · Sem registo: ${players.length-present-absent}</div>`;
}
function setTrainingAttendance(playerIndex,key,value){
  const team=typeof getSelectedTeam==='function'?getSelectedTeam():null;
  if(!team||!team.players[playerIndex])return;
  const pl=team.players[playerIndex];pl.attendance=pl.attendance||{};
  pl.attendance[key]=value;
  if(typeof saveTeams==='function')saveTeams();
  renderCoachTrainingPanel(team);renderCoachTeamStatus(team);
}
function renderTeamQuickStats(team){
  if(!team)return;
  const host=document.querySelector('#teamPage .team-header')||document.querySelector('.team-header');
  if(!host||document.getElementById('teamQuickStats'))return;
  const players=team.players||[];
  const cfg=getWeeklyTrainingConfig(team);
  const stats=document.createElement('div');stats.id='teamQuickStats';stats.className='team-quick-stats';
  stats.innerHTML=`<div class="team-quick-stat"><small>Jogadores</small><strong>${players.length}</strong></div>
  <div class="team-quick-stat"><small>Treinos / semana</small><strong>${cfg.count||0}</strong></div>
  <div class="team-quick-stat"><small>Treinos definidos</small><strong>${(team.events||[]).filter(e=>e.type==='training').length}</strong></div>
  <div class="team-quick-stat"><small>Jogos futuros</small><strong>${(team.events||[]).filter(e=>e.type==='match'&&e.date&&new Date(e.date)>=new Date()).length}</strong></div>`;
  host.parentNode.insertBefore(stats,host.nextSibling);
}


function renderPlayerAdminTools(){
  const box=document.getElementById('playerAdminToolsContent'), panel=document.getElementById('playerAdminTools');
  if(!box||!panel)return;
  const role=typeof currentRole!=='undefined'?currentRole:null;
  if(role!=='admin'){panel.style.display='none';return;}
  panel.style.display='';
  const team=typeof getSelectedTeam==='function'?getSelectedTeam():null;
  if(!team){box.innerHTML='<p class="muted">Seleciona uma equipa.</p>';return;}
  const q=(document.getElementById('playerSearchInput')?.value||'').trim().toLowerCase();
  const players=(team.players||[]).map((p,i)=>({p,i})).filter(x=>!q||(x.p.name||'').toLowerCase().includes(q)||String(x.p.number||'').includes(q));
  box.innerHTML=`<button type="button" class="btn primary" onclick="openPlayerModal()">➕ Novo jogador</button>
  <div class="player-admin-list">${players.map(({p,i})=>{
    const initials=(p.name||'J').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
    const photo=p.photo?`<img class="player-mini-photo" src="${p.photo}" alt="">`:`<span class="player-mini-photo">${initials}</span>`;
    return `<div class="player-admin-row ${p.active===false?'player-inactive':''}">
      <div class="player-admin-main">${photo}<div><strong>${p.name||'Sem nome'}</strong><small>${p.number?'#'+p.number+' · ':''}${p.position||'Sem posição'}${p.active===false?' · Inativo':''}</small></div></div>
      <div class="player-admin-actions"><button type="button" onclick="editPlayer(${i})">✏️ Editar</button><button type="button" onclick="togglePlayerActive(${i})">${p.active===false?'Ativar':'Desativar'}</button></div>
    </div>`;
  }).join('')}</div>`;
}
function editPlayer(index){
  if(typeof openPlayerModal==='function')openPlayerModal(index);
  else if(typeof toast==='function')toast('Editor de jogador disponível na gestão da equipa.');
}
function togglePlayerActive(index){
  const team=typeof getSelectedTeam==='function'?getSelectedTeam():null;
  if(!team||!team.players[index])return;
  team.players[index].active=team.players[index].active===false;
  if(typeof saveTeams==='function')saveTeams();
  renderPlayerAdminTools();
  if(typeof renderTeamPage==='function')renderTeamPage();
  if(typeof toast==='function')toast(team.players[index].active===false?'Jogador desativado.':'Jogador ativado.');
}

</script>
</body>
</html>

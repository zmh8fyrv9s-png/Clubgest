const DEFAULT_TEAMS = {
  U7:  ["Arthur Silva","Leo Martins","Noah Costa","Tiago Santos"],
  U9:  ["Lucas Ferreira","Tomás Martins","Enzo Costa","Gabriel Santos","Noah Rodrigues","Dinis Silva"],
  U11: ["Mateus Pereira","Rafael Gomes","Diogo Alves","Afonso Silva"],
  U13: ["João Santos","Miguel Costa","Gonçalo Martins","Duarte Ferreira"]
};

const $ = id => document.getElementById(id);
const storage = {
  get(key, fallback) {
    try { return localStorage.getItem(key) ?? fallback; } catch (_) { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, value); return true; } catch (_) { return false; }
  }
};

let lang = ["pt","fr","en"].includes(storage.get("cgLang","pt")) ? storage.get("cgLang","pt") : "pt";
let role = ["parent","coach","admin"].includes(storage.get("cgRole","parent")) ? storage.get("cgRole","parent") : "parent";

function normalizePlayer(player, index) {
  if (typeof player === "string") {
    return {
      name: player.trim(), number: index + 1, position: "",
      photo:"", birthDate:"", guardian:"", phone:"", email:""
    };
  }
  if (!player || typeof player !== "object") return null;
  return {
    name: String(player.name || "").trim(),
    number: Number.isFinite(Number(player.number)) ? Number(player.number) : index + 1,
    position: String(player.position || "").trim(),
    photo: String(player.photo || ""),
    birthDate: String(player.birthDate || ""),
    guardian: String(player.guardian || ""),
    phone: String(player.phone || ""),
    email: String(player.email || "")
  };
}

function normalizeTeam(teamName, value) {
  const name = String(teamName || "").trim().toUpperCase();
  if (!name) return null;
  if (Array.isArray(value)) {
    return { name, coach:"", assistant:"", season:"2026/2027", notes:"", players:value.map(normalizePlayer).filter(Boolean), events:[] };
  }
  if (!value || typeof value !== "object") return null;
  const rawPlayers = Array.isArray(value.players) ? value.players : [];
  const rawEvents = Array.isArray(value.events) ? value.events : [];
  return {
    name,
    coach:String(value.coach || "").trim(),
    assistant:String(value.assistant || "").trim(),
    season:String(value.season || "2026/2027").trim(),
    notes:String(value.notes || "").trim(),
    players:rawPlayers.map(normalizePlayer).filter(p => p && p.name),
    events:rawEvents.map((event, i) => ({
      id:String(event.id || `${name}-${i}-${Date.now()}`),
      type:event.type === "match" ? "match" : "training",
      name:String(event.name || "").trim(),
      date:String(event.date || ""),
      time:String(event.time || ""),
      location:String(event.location || "").trim(),
      opponent:String(event.opponent || "").trim()
    }))
  };
}

function normalizeTeams(raw) {
  const result = {};
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return result;
  Object.entries(raw).forEach(([teamName, value]) => {
    const team = normalizeTeam(teamName, value);
    if (team) result[team.name] = team;
  });
  return result;
}

function loadTeams() {
  const saved = storage.get("cgTeams", "");
  if (saved) {
    try {
      const parsed = normalizeTeams(JSON.parse(saved));
      if (Object.keys(parsed).length) return parsed;
    } catch (_) {}
  }

  const legacy = storage.get("cgPlayers", "");
  const raw = structuredClone(DEFAULT_TEAMS);
  if (legacy) {
    try {
      const oldPlayers = JSON.parse(legacy);
      if (Array.isArray(oldPlayers) && oldPlayers.length) raw.U9 = oldPlayers;
    } catch (_) {}
  }
  return normalizeTeams(raw);
}
let teams = loadTeams();
let selectedTeam = storage.get("cgSelectedTeam","U9").toUpperCase();
if (!teams[selectedTeam]) selectedTeam = Object.keys(teams)[0] || "U9";
let players = teams[selectedTeam]?.players || [];

function currentTeam() {
  return teams[selectedTeam] || {name:selectedTeam,coach:"",assistant:"",season:"2026/2027",notes:"",players:[],events:[]};
}

function syncCurrentTeam() {
  if (!teams[selectedTeam]) return;
  teams[selectedTeam].players = players;
}

function t(key) {
  return T[lang]?.[key] ?? T.pt[key] ?? key;
}

function persistTeams() {
  syncCurrentTeam();
  storage.set("cgTeams", JSON.stringify(teams));
  storage.set("cgSelectedTeam", selectedTeam);
}

function selectTeam(value) {
  persistTeams();
  const next = String(value || "").toUpperCase();
  if (!teams[next]) return;
  selectedTeam = next;
  players = teams[selectedTeam]?.players || [];
  storage.set("cgSelectedTeam", selectedTeam);
  render();
}

function setLang(value) {
  lang = ["pt","fr","en"].includes(value) ? value : "pt";
  storage.set("cgLang", lang);
  render();
}

function setRole(value) {
  role = ["parent","coach","admin"].includes(value) ? value : "parent";
  storage.set("cgRole", role);
  render();
}

function currentTeamLabel() {
  return selectedTeam || "U9";
}

function initials(name) {
  const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
  return parts.slice(0,2).map(x => x[0].toUpperCase()).join("") || "??";
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[ch]));
}

function attendanceKey(team, name) {
  return `cg_att_${team}_${name}`;
}

function isPresent(team, name) {
  return storage.get(attendanceKey(team, name), "false") === "true";
}

function go(id) {
  const screen = $(id);
  if (!screen) return;
  document.querySelectorAll(".screen").forEach(x => x.classList.remove("active"));
  screen.classList.add("active");
  document.querySelectorAll(".nav button").forEach(x => x.classList.remove("active"));
  const navId = {attendance:"att", calendar:"cal", manage:"man", team:"team", home:"home"}[id];
  if (navId && $(`n-${navId}`)) $(`n-${navId}`).classList.add("active");
  render();
}

function render() {
  $("lang").value = lang;
  $("role").value = role;
  $("n-att").style.display = "block";
  $("n-man").style.display = role === "admin" ? "block" : "none";
  home();
  attendance();
  calendar();
  manage();
  teamPage();
  $("n-team").style.display = role === "admin" ? "block" : "none";
  document.querySelectorAll("[data-k]").forEach(x => x.textContent = t(x.dataset.k));
}

function home() {
  const roleName = t(role);
  const teamForView = role === "parent" ? "U9" : currentTeamLabel();
  $("home").innerHTML = `
    <div class="hero">
      <div>
        <span class="pill">${escapeHTML(roleName)}</span>
        <h1>${escapeHTML(t("welcome"))}</h1>
        <div class="muted">${escapeHTML(t("club"))} · ${escapeHTML(teamForView)}</div>
      </div>
      <div class="crest">⚽</div>
    </div>
    <div class="grid">
      <div class="card stat"><span class="muted">${escapeHTML(t("players"))}</span><b>${role==="parent" ? "1" : players.length}</b></div>
      <div class="card stat"><span class="muted">${escapeHTML(t("training"))}</span><b>18:30</b></div>
      <div class="card stat"><span class="muted">${escapeHTML(t("match"))}</span><b>10:00</b></div>
      <div class="card stat"><span class="muted">${escapeHTML(t("news"))}</span><b>1</b></div>
    </div>
    <div class="section">
      <div class="sectionhead"><h2>${escapeHTML(t("next"))}</h2></div>
      <div class="list">
        <div class="row"><div class="left"><div class="avatar">⚽</div><div><b>${escapeHTML(t("training"))}</b><div class="muted">${escapeHTML(t("trainingAt"))} · ${escapeHTML(t("field"))}</div></div></div><span class="pill">${escapeHTML(teamForView)}</span></div>
        <div class="row"><div class="left"><div class="avatar">VS</div><div><b>${escapeHTML(t("match"))} · ${escapeHTML(t("opponent"))}</b><div class="muted">${escapeHTML(t("matchAt"))} · ${escapeHTML(t("field"))}</div></div></div><span class="pill">${escapeHTML(teamForView)}</span></div>
      </div>
    </div>
    <div class="section"><div class="actions">
      <button class="btn red" onclick="go('attendance')">${escapeHTML(t("attendance"))}</button>
      ${role==="admin" ? `<button class="btn" onclick="go('manage')">${escapeHTML(t("admin"))}</button>` : ""}
    </div></div>`;
}

function attendance() {
  if (role === "parent") {
    const present = isPresent("U9", "Lucas Ferreira");
    $("attendance").innerHTML = `
      <div class="sectionhead"><h2>${escapeHTML(t("attendance"))}</h2></div>
      <div class="card">
        <span class="pill">${escapeHTML(t("mychild"))}</span>
        <h2>Lucas Ferreira</h2>
        <p class="muted">${escapeHTML(t("onlychild"))}</p>
        <div class="actions">
          <button class="btn red" onclick="saveAttendance('Lucas Ferreira',true)">${escapeHTML(t("present"))}${present ? " ✓" : ""}</button>
          <button class="btn light" onclick="saveAttendance('Lucas Ferreira',false)">${escapeHTML(t("absent"))}${!present ? " ✓" : ""}</button>
        </div>
      </div>`;
    return;
  }

  const team = currentTeamLabel();
  $("attendance").innerHTML = `
    <div class="sectionhead"><h2>${escapeHTML(t("attendance"))}</h2><span class="pill">${escapeHTML(team)}</span></div>
    <div class="card">
      <p class="muted">${escapeHTML(role === "coach" ? t("coach") : t("admin"))} · ${escapeHTML(team)}</p>
      <div class="list">
        ${players.length ? players.map((p,i) => `
          <label class="check">
            <input type="checkbox" id="p${i}" ${isPresent(team,p.name) ? "checked" : ""}>
            <span><b>${escapeHTML(p.name)}</b><small class="muted"> · #${escapeHTML(p.number)}${p.position ? " · "+escapeHTML(p.position) : ""}</small></span>
          </label>`).join("") : `<p class="muted">${escapeHTML(t("noPlayers"))}</p>`}
      </div>
      ${players.length ? `<br><button class="btn red" onclick="saveTeamAttendance()">${escapeHTML(t("save"))}</button>` : ""}
    </div>`;
}

function saveAttendance(name, value) {
  storage.set(attendanceKey("U9", name), String(Boolean(value)));
  toast(t("attendanceSaved"));
  attendance();
}

function saveTeamAttendance() {
  players.forEach((p,i) => {
    const checkbox = $(`p${i}`);
    if (checkbox) storage.set(attendanceKey(currentTeamLabel(), p.name), String(checkbox.checked));
  });
  toast(t("attendanceSaved"));
}

function calendar() {
  const team = role === "parent" ? "U9" : currentTeamLabel();
  $("calendar").innerHTML = `
    <div class="sectionhead"><h2>${escapeHTML(t("calendar"))}</h2><span class="pill">${escapeHTML(team)}</span></div>
    <div class="list">
      <div class="row"><div><b>${escapeHTML(t("training"))}</b><div class="muted">${escapeHTML(t("trainingAt"))} · ${escapeHTML(t("field"))}</div></div><span class="pill">${escapeHTML(team)}</span></div>
      <div class="row"><div><b>${escapeHTML(t("match"))} · ${escapeHTML(t("opponent"))}</b><div class="muted">${escapeHTML(t("matchAt"))} · ${escapeHTML(t("field"))}</div></div><span class="pill">${escapeHTML(team)}</span></div>
    </div>`;
}

function manage() {
  if (role !== "admin") {
    $("manage").innerHTML = "";
    return;
  }

  const teamNames = Object.keys(teams);
  if (!teamNames.length) {
    $("manage").innerHTML = `<div class="card"><p>${escapeHTML(t("noTeams"))}</p><button class="btn red" onclick="newTeam()">${escapeHTML(t("addTeam"))}</button></div>`;
    return;
  }

  const team = currentTeam();
  const teamOptions = teamNames.map(name =>
    `<option value="${escapeHTML(name)}" ${name===selectedTeam ? "selected" : ""}>${escapeHTML(name)}</option>`
  ).join("");

  $("manage").innerHTML = `
    <div class="sectionhead"><h2>${escapeHTML(t("admin"))}</h2><span class="pill">${escapeHTML(selectedTeam)}</span></div>

    <div class="card teamselect">
      <div><span class="muted">${escapeHTML(t("selectTeam"))}</span><h2 style="margin-top:5px">${escapeHTML(t("teamOverview"))} · ${escapeHTML(selectedTeam)}</h2></div>
      <div class="actions">
        <select class="lang" style="min-width:180px" aria-label="${escapeHTML(t("selectTeam"))}" onchange="selectTeam(this.value)">${teamOptions}</select>
        <button class="btn red" onclick="newTeam()">${escapeHTML(t("addTeam"))}</button>
        <button class="btn" onclick="go('team')">${escapeHTML(t("openTeam"))}</button>
        <button class="btn light" onclick="editTeamInfo()">${escapeHTML(t("editTeam"))}</button>
        ${teamNames.length > 1 ? `<button class="btn light" onclick="deleteCurrentTeam()">${escapeHTML(t("deleteTeam"))}</button>` : ""}
      </div>
    </div>

    <div class="grid">
      <div class="card stat"><span class="muted">${escapeHTML(t("players"))}</span><b>${players.length}</b><div class="muted">${escapeHTML(selectedTeam)}</div></div>
      <div class="card"><span class="muted">${escapeHTML(t("teamCoach"))}</span><b style="font-size:18px">${escapeHTML(team.coach || t("noCoach"))}</b></div>
      <div class="card"><span class="muted">${escapeHTML(t("teamSeason"))}</span><b style="font-size:18px">${escapeHTML(team.season)}</b></div>
      <div class="card"><span class="muted">${escapeHTML(t("teamEvents"))}</span><b style="font-size:25px">${team.events.length}</b></div>
    </div>

    <div class="section">
      <div class="sectionhead"><h2>${escapeHTML(t("teamInfo"))}</h2><button class="btn light" onclick="editTeamInfo()">${escapeHTML(t("editTeam"))}</button></div>
      <div class="card">
        <div class="profilegrid">
          <div><span class="muted">${escapeHTML(t("teamCoach"))}</span><div><b>${escapeHTML(team.coach || t("noCoach"))}</b></div></div>
          <div><span class="muted">${escapeHTML(t("teamAssistant"))}</span><div><b>${escapeHTML(team.assistant || "—")}</b></div></div>
          <div><span class="muted">${escapeHTML(t("teamSeason"))}</span><div><b>${escapeHTML(team.season)}</b></div></div>
          <div><span class="muted">${escapeHTML(t("teamNotes"))}</span><div><b>${escapeHTML(team.notes || "—")}</b></div></div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="sectionhead"><h2>${escapeHTML(t("players"))} · ${escapeHTML(selectedTeam)}</h2><button class="btn red" onclick="newPlayer()">${escapeHTML(t("add"))}</button></div>
      <div class="list">
        ${players.length ? players.map((p,i) => `
          <div class="row">
            <div class="left">
              ${p.photo ? `<img class="playerphoto" src="${escapeHTML(p.photo)}" alt="${escapeHTML(p.name)}">` : `<div class="avatar">${escapeHTML(initials(p.name))}</div>`}
              <div>
                <b>${escapeHTML(p.name)}</b>
                <div class="muted">${escapeHTML(selectedTeam)} · #${escapeHTML(p.number)}${p.position ? " · "+escapeHTML(p.position) : ""}</div>
                ${p.guardian ? `<div class="muted">${escapeHTML(p.guardian)}</div>` : ""}
                ${p.phone ? `<div class="muted">${escapeHTML(p.phone)}</div>` : ""}
              </div>
            </div>
            <button class="btn light" onclick="editPlayer(${i})">${escapeHTML(t("edit"))}</button>
          </div>`).join("") : `<div class="card"><p class="muted">${escapeHTML(t("noPlayers"))}</p></div>`}
      </div>
    </div>

    <div class="section">
      <div class="sectionhead"><h2>${escapeHTML(t("teamEvents"))}</h2><button class="btn red" onclick="newEvent()">${escapeHTML(t("newEvent"))}</button></div>
      <div class="list">
        ${team.events.length ? team.events.slice().sort((a,b)=>`${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`)).map((e,i) => `
          <div class="row">
            <div>
              <b>${escapeHTML(e.name || (e.type==="match" ? t("matchType") : t("trainingType")))}</b>
              <div class="muted">${escapeHTML(e.date || "—")} ${escapeHTML(e.time || "")} · ${escapeHTML(e.location || "—")}${e.opponent ? " · "+escapeHTML(e.opponent) : ""}</div>
            </div>
            <button class="btn light" onclick="deleteEvent('${escapeHTML(e.id)}')">${escapeHTML(t("deleteEvent"))}</button>
          </div>`).join("") : `<div class="card"><p class="muted">${escapeHTML(t("noEvents"))}</p></div>`}
      </div>
    </div>
  `;
}
let teamTab = "overview";

function showTeamTab(tab) {
  teamTab = ["overview","players","trainings","games","attendance"].includes(tab) ? tab : "overview";
  teamPage();
}

function teamEventList(type) {
  const events = currentTeam().events.filter(e => e.type === type);
  if (!events.length) return `<div class="card"><p class="muted">${escapeHTML(t("noEvents"))}</p></div>`;
  return `<div class="list">${events.slice().sort((a,b)=>`${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`)).map(e => `
    <div class="row"><div><b>${escapeHTML(e.name || (type==="match" ? t("matchType") : t("trainingType")))}</b>
    <div class="muted">${escapeHTML(e.date || "—")} ${escapeHTML(e.time || "")} · ${escapeHTML(e.location || "—")}${e.opponent ? " · "+escapeHTML(e.opponent) : ""}</div></div>
    <button class="btn light" onclick="deleteEvent('${escapeHTML(e.id)}')">${escapeHTML(t("deleteEvent"))}</button></div>`).join("")}</div>`;
}

function teamPage() {
  if (role !== "admin") { $("team").innerHTML = ""; return; }
  const team = currentTeam();
  const presentCount = players.filter(p => isPresent(selectedTeam, p.name)).length;
  const attendancePercent = players.length ? Math.round((presentCount / players.length) * 100) : 0;

  $("team").innerHTML = `
    <div class="teamhero"><div class="actions" style="justify-content:space-between">
      <div><span class="pill">${escapeHTML(selectedTeam)}</span><h1 style="margin:8px 0 4px">${escapeHTML(t("teamPage"))}</h1>
      <div class="muted">${escapeHTML(team.season)} · ${escapeHTML(t("teamCoach"))}: ${escapeHTML(team.coach || t("noCoach"))}</div></div>
      <button class="btn light" onclick="go('manage')">${escapeHTML(t("back"))}</button>
    </div></div>

    <div class="tabs" role="tablist">
      <button class="${teamTab==="overview"?"active":""}" onclick="showTeamTab('overview')">${escapeHTML(t("overview"))}</button>
      <button class="${teamTab==="players"?"active":""}" onclick="showTeamTab('players')">${escapeHTML(t("teamPlayersTab"))}</button>
      <button class="${teamTab==="trainings"?"active":""}" onclick="showTeamTab('trainings')">${escapeHTML(t("trainings"))}</button>
      <button class="${teamTab==="games"?"active":""}" onclick="showTeamTab('games')">${escapeHTML(t("games"))}</button>
      <button class="${teamTab==="attendance"?"active":""}" onclick="showTeamTab('attendance')">${escapeHTML(t("attendanceTab"))}</button>
    </div>

    <div class="tabpane ${teamTab==="overview"?"active":""}">
      <div class="teammeta">
        <div class="card"><span class="muted">${escapeHTML(t("teamCoach"))}</span><b>${escapeHTML(team.coach || t("noCoach"))}</b></div>
        <div class="card"><span class="muted">${escapeHTML(t("teamAssistant"))}</span><b>${escapeHTML(team.assistant || t("noAssistant"))}</b></div>
        <div class="card"><span class="muted">${escapeHTML(t("players"))}</span><b>${players.length}</b></div>
      </div>
      <div class="section"><div class="sectionhead"><h2>${escapeHTML(t("teamDetails"))}</h2><button class="btn light" onclick="editTeamInfo()">${escapeHTML(t("editTeam"))}</button></div>
        <div class="card"><span class="muted">${escapeHTML(t("teamNotes"))}</span><p>${escapeHTML(team.notes || t("noNotes"))}</p></div>
      </div>
      <div class="section"><div class="sectionhead"><h2>${escapeHTML(t("teamEvents"))}</h2><button class="btn red" onclick="newEvent()">${escapeHTML(t("newEvent"))}</button></div>
        <div class="list">${team.events.slice().sort((a,b)=>`${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`)).slice(0,5).map(e=>`
          <div class="row"><div><b>${escapeHTML(e.name || (e.type==="match" ? t("matchType") : t("trainingType")))}</b><div class="muted">${escapeHTML(e.date||"—")} ${escapeHTML(e.time||"")} · ${escapeHTML(e.location||"—")}</div></div><span class="pill">${escapeHTML(e.type==="match"?t("matchType"):t("trainingType"))}</span></div>`).join("") || `<div class="card"><p class="muted">${escapeHTML(t("noEvents"))}</p></div>`}</div>
      </div>
    </div>

    <div class="tabpane ${teamTab==="players"?"active":""}">
      <div class="sectionhead"><h2>${escapeHTML(t("teamPlayersTab"))} · ${escapeHTML(selectedTeam)}</h2><button class="btn red" onclick="newPlayer()">${escapeHTML(t("add"))}</button></div>
      <div class="list">${players.map((p,i)=>`
        <div class="row"><div class="left">${p.photo ? `<img class="playerphoto" src="${escapeHTML(p.photo)}" alt="${escapeHTML(p.name)}">` : `<div class="avatar">${escapeHTML(initials(p.name))}</div>`}<div><b>${escapeHTML(p.name)}</b><div class="muted">#${escapeHTML(p.number)}${p.position ? " · "+escapeHTML(p.position) : ""}</div>${p.guardian?`<div class="muted">${escapeHTML(p.guardian)}</div>`:""}</div></div><button class="btn light" onclick="editPlayer(${i})">${escapeHTML(t("edit"))}</button></div>
      `).join("") || `<div class="card"><p class="muted">${escapeHTML(t("noPlayers"))}</p></div>`}</div>
    </div>

    <div class="tabpane ${teamTab==="trainings"?"active":""}">
      <div class="sectionhead"><h2>${escapeHTML(t("trainings"))}</h2><button class="btn red" onclick="newEventWithType('training')">${escapeHTML(t("newEvent"))}</button></div>
      ${teamEventList("training")}
    </div>

    <div class="tabpane ${teamTab==="games"?"active":""}">
      <div class="sectionhead"><h2>${escapeHTML(t("games"))}</h2><button class="btn red" onclick="newEventWithType('match')">${escapeHTML(t("newEvent"))}</button></div>
      ${teamEventList("match")}
    </div>

    <div class="tabpane ${teamTab==="attendance"?"active":""}">
      <div class="sectionhead"><h2>${escapeHTML(t("attendanceTab"))}</h2><span class="pill">${attendancePercent}%</span></div>
      <div class="card"><div class="grid" style="margin-top:0"><div class="stat"><span class="muted">${escapeHTML(t("present"))}</span><b>${presentCount}</b></div><div class="stat"><span class="muted">${escapeHTML(t("players"))}</span><b>${players.length}</b></div></div></div>
      <div class="list" style="margin-top:12px">${players.map((p,i)=>`
        <label class="check"><input type="checkbox" id="tp${i}" ${isPresent(selectedTeam,p.name)?"checked":""} onchange="setPlayerAttendance(${i},this.checked)"><span><b>${escapeHTML(p.name)}</b><small class="muted"> · #${escapeHTML(p.number)}</small></span></label>`).join("") || `<div class="card"><p class="muted">${escapeHTML(t("noPlayers"))}</p></div>`}</div>
    </div>`;
}

function setPlayerAttendance(index, value) {
  const player = players[index];
  if (!player) return;
  storage.set(attendanceKey(selectedTeam, player.name), String(Boolean(value)));
  teamPage();
}

function newEventWithType(type) {
  newEvent();
  const select = $("etype");
  if (select) select.value = type;
}

function newTeam() {
  $("sheet").innerHTML = `
    <h2>${escapeHTML(t("newTeam"))}</h2>
    <div class="form">
      <label>${escapeHTML(t("teamName"))}<input id="tn" maxlength="20" autocomplete="off" placeholder="Ex.: U15"></label>
      <div class="actions">
        <button class="btn light" onclick="closeModal()">${escapeHTML(t("cancel"))}</button>
        <button class="btn red" onclick="saveTeam()">${escapeHTML(t("save"))}</button>
      </div>
    </div>`;
  $("modal").classList.add("show");
  $("tn")?.focus();
}

function saveTeam() {
  const input = $("tn");
  const name = String(input?.value || "").trim().toUpperCase();
  if (!/^[A-Z0-9À-ÖØ-ÝÆŒŠŽ _-]{2,20}$/i.test(name)) {
    toast(t("invalidTeam")); return;
  }
  if (teams[name]) {
    toast(t("teamExists")); return;
  }
  teams[name] = [];
  selectedTeam = name;
  players = teams[name];
  persistTeams();
  closeModal();
  render();
  toast(t("teamCreated"));
}

function deleteCurrentTeam() {
  const team = selectedTeam;
  if (Object.keys(teams).length <= 1) return;
  if (!window.confirm(t("confirmDelete"))) return;
  delete teams[team];
  selectedTeam = Object.keys(teams)[0];
  players = teams[selectedTeam]?.players || [];
  persistTeams();
  render();
  toast(t("teamDeleted"));
}

function editTeamInfo() {
  const team = currentTeam();
  $("sheet").innerHTML = `
    <h2>${escapeHTML(t("editTeam"))} · ${escapeHTML(selectedTeam)}</h2>
    <div class="form">
      <label>${escapeHTML(t("teamCoach"))}<input id="tcoach" maxlength="100" value="${escapeHTML(team.coach)}"></label>
      <label>${escapeHTML(t("teamAssistant"))}<input id="tassistant" maxlength="100" value="${escapeHTML(team.assistant)}"></label>
      <label>${escapeHTML(t("teamSeason"))}<input id="tseason" maxlength="30" value="${escapeHTML(team.season)}"></label>
      <label>${escapeHTML(t("teamNotes"))}<textarea id="tnotes" maxlength="500" rows="4">${escapeHTML(team.notes)}</textarea></label>
      <div class="actions">
        <button class="btn light" onclick="closeModal()">${escapeHTML(t("cancel"))}</button>
        <button class="btn red" onclick="saveTeamInfo()">${escapeHTML(t("teamSave"))}</button>
      </div>
    </div>`;
  $("modal").classList.add("show");
  $("tcoach")?.focus();
}

function saveTeamInfo() {
  const team = currentTeam();
  team.coach = String($("tcoach")?.value || "").trim();
  team.assistant = String($("tassistant")?.value || "").trim();
  team.season = String($("tseason")?.value || "").trim() || "2026/2027";
  team.notes = String($("tnotes")?.value || "").trim();
  persistTeams();
  closeModal();
  render();
  toast(t("teamSaved"));
}

function newEvent() {
  $("sheet").innerHTML = `
    <h2>${escapeHTML(t("newEvent"))} · ${escapeHTML(selectedTeam)}</h2>
    <div class="form">
      <label>${escapeHTML(t("eventType"))}
        <select id="etype"><option value="training">${escapeHTML(t("trainingType"))}</option><option value="match">${escapeHTML(t("matchType"))}</option></select>
      </label>
      <label>${escapeHTML(t("eventName"))}<input id="ename" maxlength="100" placeholder="${escapeHTML(t("trainingType"))}"></label>
      <div class="profilegrid">
        <label>${escapeHTML(t("eventDate"))}<input id="edate" type="date"></label>
        <label>${escapeHTML(t("eventTime"))}<input id="etime" type="time"></label>
      </div>
      <label>${escapeHTML(t("eventLocation"))}<input id="elocation" maxlength="120"></label>
      <label>${escapeHTML(t("eventOpponent"))}<input id="eopponent" maxlength="100"></label>
      <div class="actions">
        <button class="btn light" onclick="closeModal()">${escapeHTML(t("cancel"))}</button>
        <button class="btn red" onclick="saveEvent()">${escapeHTML(t("save"))}</button>
      </div>
    </div>`;
  $("modal").classList.add("show");
  $("edate")?.focus();
}

function saveEvent() {
  const team = currentTeam();
  const type = $("etype")?.value === "match" ? "match" : "training";
  const event = {
    id: `${selectedTeam}-${Date.now()}`,
    type,
    name:String($("ename")?.value || "").trim() || (type==="match" ? t("matchType") : t("trainingType")),
    date:String($("edate")?.value || ""),
    time:String($("etime")?.value || ""),
    location:String($("elocation")?.value || "").trim(),
    opponent:String($("eopponent")?.value || "").trim()
  };
  team.events.push(event);
  persistTeams();
  closeModal();
  render();
  toast(t("eventCreated"));
}

function deleteEvent(id) {
  if (!window.confirm(t("confirmEventDelete"))) return;
  const team = currentTeam();
  team.events = team.events.filter(e => e.id !== id);
  persistTeams();
  render();
}
function newPlayer() {
  openForm(-1);
}

function editPlayer(index) {
  openForm(index);
}

function openForm(index) {
  const p = index >= 0 ? players[index] : {
    name:"", number:players.length+1, position:"", photo:"", birthDate:"",
    guardian:"", phone:"", email:""
  };

  $("sheet").innerHTML = `
    <h2>${escapeHTML(index >= 0 ? t("details") : t("newplayer"))} · ${escapeHTML(selectedTeam)}</h2>
    <div class="form">
      <label>${escapeHTML(t("name"))}<input id="pn" maxlength="80" value="${escapeHTML(p.name)}" autocomplete="name"></label>
      <div class="profilegrid">
        <label>${escapeHTML(t("number"))}<input id="pnum" value="${escapeHTML(p.number ?? "")}" type="number" min="0" max="99"></label>
        <label>${escapeHTML(t("position"))}<input id="ppos" maxlength="40" value="${escapeHTML(p.position || "")}></label>
      </div>
      <label>${escapeHTML(t("photo"))}<input id="pphoto" type="url" maxlength="500" value="${escapeHTML(p.photo || "")}" placeholder="https://..." oninput="previewPlayerPhoto()"></label>
      <div id="photoPreview" class="muted">${p.photo ? `<img class="playerphoto" src="${escapeHTML(p.photo)}" alt="${escapeHTML(p.name)}">` : escapeHTML(t("noPhoto"))}</div>
      <label>${escapeHTML(t("birthDate"))}<input id="pbirth" type="date" value="${escapeHTML(p.birthDate || "")}"></label>
      <label>${escapeHTML(t("guardian"))}<input id="pguardian" maxlength="100" value="${escapeHTML(p.guardian || "")}" autocomplete="name"></label>
      <div class="profilegrid">
        <label>${escapeHTML(t("phone"))}<input id="pphone" type="tel" maxlength="30" value="${escapeHTML(p.phone || "")}" autocomplete="tel"></label>
        <label>${escapeHTML(t("email"))}<input id="pemail" type="email" maxlength="120" value="${escapeHTML(p.email || "")}" autocomplete="email"></label>
      </div>
      <div class="actions">
        <button class="btn light" onclick="closeModal()">${escapeHTML(t("cancel"))}</button>
        <button class="btn red" onclick="savePlayer(${index})">${escapeHTML(t("save"))}</button>
      </div>
    </div>`;
  $("modal").classList.add("show");
  $("pn")?.focus();
}

function previewPlayerPhoto() {
  const value = String($("pphoto")?.value || "").trim();
  const preview = $("photoPreview");
  if (!preview) return;
  preview.innerHTML = value
    ? `<img class="playerphoto" src="${escapeHTML(value)}" alt="">`
    : escapeHTML(t("noPhoto"));
}

function savePlayer(index) {
  const name = String($("pn")?.value || "").trim();
  if (!name) return;

  const rawNumber = Number($("pnum")?.value);
  const number = Number.isFinite(rawNumber) && rawNumber >= 0 && rawNumber <= 99
    ? rawNumber
    : (index >= 0 ? players[index].number : players.length + 1);

  const duplicate = players.some((p,i) => i !== index && Number(p.number) === number);
  if (duplicate) {
    toast(t("duplicateNumber"));
    return;
  }

  const player = {
    name,
    number,
    position: String($("ppos")?.value || "").trim(),
    photo: String($("pphoto")?.value || "").trim(),
    birthDate: String($("pbirth")?.value || ""),
    guardian: String($("pguardian")?.value || "").trim(),
    phone: String($("pphone")?.value || "").trim(),
    email: String($("pemail")?.value || "").trim()
  };

  if (index < 0) players.push(player);
  else if (players[index]) players[index] = player;

  persistTeams();
  closeModal();
  render();
  toast(t("playerSaved"));
}
function closeModal() {
  $("modal").classList.remove("show");
}

function toast(message) {
  const node = $("toast");
  node.textContent = message;
  node.classList.add("show");
  clearTimeout(window.__clubGestToast);
  window.__clubGestToast = setTimeout(() => node.classList.remove("show"), 1800);
}

$("modal").addEventListener("click", event => {
  if (event.target === $("modal")) closeModal();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeModal();
});

render();
go("home");
</script>
</body>
</html>

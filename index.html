1px;background:#fff;border:1px solid var(--line);margin-bottom:12px}.teammeta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.teammeta div{background:#f7f8fa;border:1px solid #eef0f2;border-radius:13px;padding:10px}.teammeta small{display:block;color:var(--muted);font-size:10px}.teammeta strong{display:block;margin-top:3px}.playergrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.player{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px;border:1px solid var(--line);border-radius:14px}.player .photo{width:42px;height:42px;border-radius:12px;background:#eef1f4;display:grid;place-items:center;font-weight:850;overflow:hidden}.player .photo img{width:100%;height:100%;object-fit:cover}.notice{display:flex;gap:10px;padding:11px 0;border-top:1px solid #eef0f2}.notice:first-child{border-top:0}.notice i{width:34px;height:34px;border-radius:10px;background:#f2f4f7;display:grid;place-items:center;font-style:normal}.progress{height:7px;background:#edf0f3;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#111827;border-radius:99px}.choice{display:flex;gap:5px}.choice button{padding:7px 9px;border:1px solid #dfe3e8;background:#fff;border-radius:9px;font-size:11px}.choice button.active{background:#111827;color:#fff}.choice button.yes.active{background:var(--ok)}.choice button.no.active{background:var(--brand)}.empty{padding:20px;text-align:center;border:1px dashed #d9dde3;border-radius:15px;color:var(--muted);font-size:12px}.toast{position:fixed;left:50%;bottom:75px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 15px;border-radius:12px;z-index:70;display:none;font-size:12px}.toast.show{display:block}.searchbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.searchbar input,.searchbar select{flex:1;min-width:150px;padding:10px;border:1px solid #dfe3e8;border-radius:10px;background:#fff}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

<body>
<div class="app">
<header class="top"><div class="topin">
<div class="brand"><div class="crest" aria-label="ClubGest">CG</div><div><span class="cg-title">CLUBGEST</span><small>FCD03 Differdange · U16</small></div></div>
<select id="role" class="select" onchange="setRole(this.value)"><option value="parent">👨‍👩‍👧 Parent</option><option value="coach">⚽ Coach</option><option value="admin">🛠 Admin</option></select>
<select id="lang" class="select" onchange="setLang(this.value)"><option value="pt">PT</option><option value="fr">FR</option><option value="en">EN</option></select>
</div></header>
<main class="main">
<div class="today"><div><small>CLUBGEST</small><strong id="todayDate">Hoje</strong></div><div class="badges"><span class="badge" id="todayTeam">U9</span><span class="badge green" id="todayStatus">Sistema ativo</span></div></div>

</main>

<script>
'use strict';
const $=id=>document.getElementById(id);const KEY='clubgest_v3';
const I18N={pt:{welcome:'Bom trabalho. Vamos avançar.',parent:'Encarregado',coach:'Treinador',admin:'Administrador',players:'Jogadores',trainings:'Treinos',games:'Jogos',attendance:'Presenças',calendar:'Calendário',manage:'Gestão',next:'Próximas atividades',training:'Treino',match:'Jogo',present:'Presente',absent:'Ausente',pending:'Pendente',save:'Guardar',cancel:'Cancelar',newPlayer:'Novo jogador',newEvent:'Novo evento',team:'Equipa',overview:'Resumo',noData:'Sem dados ainda.',today:'Hoje',confirm:'Confirmar',confirmed:'Confirmado',planning:'Planeamento',communication:'Comunicação'},fr:{welcome:'Bon travail. On avance.',parent:'Parent',coach:'Entraîneur',admin:'Administrateur',players:'Joueurs',trainings:'Entraînements',games:'Matchs',attendance:'Présences',calendar:'Calendrier',manage:'Gestion',next:'Prochaines activités',training:'Entraînement',match:'Match',present:'Présent',absent:'Absent',pending:'En attente',save:'Enregistrer',cancel:'Annuler',newPlayer:'Nouveau joueur',newEvent:'Nouvel événement',team:'Équipe',overview:'Résumé',noData:'Aucune donnée.',today:"Aujourd'hui",confirm:'Confirmer',confirmed:'Confirmé',planning:'Planification',communication:'Communication'},en:{welcome:'Good work. Let’s move forward.',parent:'Parent',coach:'Coach',admin:'Administrator',players:'Players',trainings:'Training',games:'Matches',attendance:'Attendance',calendar:'Calendar',manage:'Management',next:'Upcoming activities',training:'Training',match:'Match',present:'Present',absent:'Absent',pending:'Pending',save:'Save',cancel:'Cancel',newPlayer:'New player',newEvent:'New event',team:'Team',overview:'Overview',noData:'No data yet.',today:'Today',confirm:'Confirm',confirmed:'Confirmed',planning:'Planning',communication:'Communication'}};
function t(k){return I18N[lang]?.[k]??I18N.pt[k]??k}function read(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
const seed={selected:'U9',teams:{U7:{coach:'João Pereira',assistant:'Marc Weber',season:'2026/2027',players:['Arthur Silva','Leo Martins','Noah Costa','Tiago Santos'],events:[{id:'u7-1',type:'training',date:'2026-09-03',time:'18:00',location:'Terrain 1',name:'Treino U7'}]},U9:{coach:'Alex Duarte',assistant:'S. Martins',season:'2026/2027',players:['Lucas Ferreira','Tomás Martins','Enzo Costa','Gabriel Santos','Noah Rodrigues','Dinis Silva'],events:[{id:'u9-1',type:'training',date:'2026-09-03',time:'18:30',location:'Campo Municipal 2',name:'Treino U9'},{id:'u9-2',type:'match',date:'2026-09-05',time:'10:00',location:'Campo Municipal 2',name:'Jogo U9',opponent:'Racing FC'}]},U11:{coach:'Miguel Lopes',assistant:'',season:'2026/2027',players:['Mateus Pereira','Rafael Gomes','Diogo Alves','Afonso Silva'],events:[{id:'u11-1',type:'training',date:'2026-09-04',time:'18:30',location:'Terrain 2',name:'Treino U11'}]}},attendance:{},plans:{},notices:[{id:1,title:'Treinos desta semana',text:'Confirma a disponibilidade antes do treino.',date:'2026-09-02'},{id:2,title:'Convocatórias',text:'As convocatórias são publicadas pelo treinador.',date:'2026-09-01'}]};
let data=read()||seed;let lang=localStorage.getItem('cgLang')||'pt';let role=localStorage.getItem('cgRole')||'parent';let current='home';
function save(){localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem('cgLang',lang);localStorage.setItem('cgRole',role)}function team(){return data.teams[data.selected]||data.teams.U9}function names(){return team().players.map((p,i)=>typeof p==='string'?{name:p,number:i+1,position:'',active:true}:p)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function initials(n){return String(n).trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'??'}function isoToday(){return new Date().toISOString().slice(0,10)}function fmt(d){try{return new Intl.DateTimeFormat(lang==='pt'?'pt-PT':lang,{weekday:'short',day:'2-digit',month:'2-digit'}).format(new Date(d+'T12:00:00'))}catch(e){return d}}
function setRole(v){role=['parent','coach','admin'].includes(v)?v:'parent';save();render()}function setLang(v){lang=['pt','fr','en'].includes(v)?v:'pt';save();render()}function go(id){current=id;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id)?.classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));const m={home:'n-home',attendance:'n-att',calendar:'n-cal',manage:'n-man',team:'n-team'};$(m[id])?.classList.add('active');render()}function selectTeam(v){if(data.teams[v]){data.selected=v;save();render()}}function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}function openModal(html){$('sheet').innerHTML=html;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function eventList(){return Object.values(data.teams).flatMap(x=>x.events||[]).filter(e=>e.date).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))}function nextEvents(){return (team().events||[]).filter(e=>e.date>=isoToday()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,5)}
function home(){const p=names(),ev=nextEvents(),roleLabel=t(role),next=ev[0];$('home').innerHTML=`<div class="hero"><div><span class="badge dark">${esc(roleLabel)}</span><h1>${esc(t('welcome'))}</h1><p>FCD03 Differdange · ${esc(data.selected)} · época ${esc(team().season)}</p></div><div class="crest" aria-label="ClubGest">CG</div></div><div class="grid"><div class="card stat"><small>${t('players')}</small><strong>${role==='parent'?'1':p.length}</strong></div><div class="card stat"><small>${t('trainings')}</small><strong>${(team().events||[]).filter(e=>e.type==='training').length}</strong></div><div class="card stat"><small>${t('games')}</small><strong>${(team().events||[]).filter(e=>e.type==='match').length}</strong></div><div class="card stat"><small>${t('attendance')}</small><strong>${attendanceRate()}%</strong></div></div><div class="section"><div class="head"><div><h2>${t('next')}</h2><p>${next?esc(fmt(next.date))+' · '+esc(next.time):t('noData')}</p></div><button class="btn light small" onclick="go('calendar')">Ver calendário</button></div><div class="list">${ev.length?ev.map(e=>`<div class="row"><div class="left"><div class="avatar">${e.type==='match'?'VS':'⚽'}</div><div><strong>${esc(e.name||t(e.type))}${e.opponent?' · '+esc(e.opponent):''}</strong><span class="muted">${esc(fmt(e.date))} · ${esc(e.time||'—')} · ${esc(e.location||'—')}</span></div></div><span class="badge ${e.type==='match'?'red':''}">${e.type==='match'?t('match'):t('training')}</span></div>`).join(''):'<div class="empty">'+t('noData')+'</div>'}</div></div><div class="section featuregrid"><div class="feature"><div class="icon">📋</div><h3>${t('planning')}</h3><p>Planeia treinos, jogos e disponibilidade.</p></div><div class="feature"><div class="icon">📊</div><h3>${t('attendance')}</h3><p>Regista presenças e acompanha a evolução.</p></div><div class="feature"><div class="icon">🔔</div><h3>${t('communication')}</h3><p>Avisos claros para famílias e equipa técnica.</p></div></div><div class="section card"><div class="head"><div><h3>Ações rápidas</h3><p>Atalhos para o que importa hoje.</p></div></div><div class="actions"><button class="btn red" onclick="go('attendance')">✓ ${t('attendance')}</button><button class="btn" onclick="go('team')">⚽ ${t('team')}</button>${role!=='parent'?'<button class="btn light" onclick="openEvent()">+ '+t('newEvent')+'</button>':''}</div></div>`}
function attendanceRate(){const p=names();if(!p.length)return 0;const vals=p.map(x=>data.attendance?.[data.selected+'|'+x.name]);const known=vals.filter(v=>v==='present'||v==='absent');if(!known.length)return 0;return Math.round(known.filter(v=>v==='present').length/known.length*100)}function setAttendance(name,status){data.attendance[data.selected+'|'+name]=status;save();render();toast(t('save')+' ✓')}
function attendance(){const p=names();if(role==='parent'){const child=p[0]?.name||'Lucas Ferreira',st=data.attendance[data.selected+'|'+child]||'pending';$('attendance').innerHTML=`<div class="head"><div><h2>${t('attendance')}</h2><p>Confirma apenas a disponibilidade do teu filho.</p></div></div><div class="card"><div class="left"><div class="avatar">${initials(child)}</div><div><strong>${esc(child)}</strong><span class="muted">${esc(data.selected)} · ${st==='present'?t('present'):st==='absent'?t('absent'):t('pending')}</span></div></div><div class="actions" style="margin-top:14px"><button class="btn green" onclick="setAttendance('${esc(child)}','present')">✓ ${t('present')}</button><button class="btn red" onclick="setAttendance('${esc(child)}','absent')">✕ ${t('absent')}</button></div></div><div class="section card"><div class="head"><div><h3>Próximos treinos</h3><p>Disponibilidade e informação do treino.</p></div></div>${nextEvents().filter(e=>e.type==='training').map(e=>`<div class="notice"><i>⚽</i><div><strong>${esc(e.name)}</strong><span class="muted">${fmt(e.date)} · ${e.time} · ${esc(e.location)}</span></div></div>`).join('')||'<div class="empty">Sem treinos próximos.</div>'}</div>`;return}$('attendance').innerHTML=`<div class="head"><div><h2>${t('attendance')} — ${esc(data.selected)}</h2><p>Marca presença, ausência ou pendente por jogador.</p></div><span class="badge">${attendanceRate()}% ${t('present')}</span></div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Jogador</th><th>Nº</th><th>Posição</th><th>Estado</th></tr></thead><tbody>${p.map(x=>{const st=data.attendance[data.selected+'|'+x.name]||'pending';return `<tr><td><strong>${esc(x.name)}</strong></td><td>${x.number}</td><td>${esc(x.position||'—')}</td><td><div class="choice"><button class="${st==='present'?'active yes':''}" onclick="setAttendance('${esc(x.name)}','present')">✓</button><button class="${st==='absent'?'active no':''}" onclick="setAttendance('${esc(x.name)}','absent')">✕</button><button class="${st==='pending'?'active':''}" onclick="setAttendance('${esc(x.name)}','pending')">?</button></div></td></tr>`}).join('')}</tbody></table></div></div>`}
function calendar(){const ev=nextEvents();$('calendar').innerHTML=`<div class="head"><div><h2>${t('calendar')}</h2><p>Treinos e jogos da equipa ${esc(data.selected)}.</p></div>${role!=='parent'?'<button class="btn red" onclick="openEvent()">+ '+t('newEvent')+'</button>':''}</div><div class="list">${ev.map(e=>`<div class="row"><div class="left"><div class="avatar">${e.type==='match'?'VS':'⚽'}</div><div><strong>${esc(e.name||t(e.type))}${e.opponent?' · '+esc(e.opponent):''}</strong><span class="muted">${esc(fmt(e.date))} · ${esc(e.time||'—')} · ${esc(e.location||'—')}</span></div></div>${role!=='parent'?`<button class="btn light small" onclick="removeEvent('${esc(e.id)}')">Apagar</button>`:''}</div>`).join('')||'<div class="empty">'+t('noData')+'</div>'}</div><div class="section card"><div class="head"><div><h3>Visão da semana</h3><p>O próximo compromisso aparece sempre primeiro.</p></div></div><div class="list">${ev.slice(0,3).map(e=>`<div class="notice"><i>${e.type==='match'?'🏆':'⚽'}</i><div><strong>${esc(fmt(e.date))} · ${esc(e.time)}</strong><span class="muted">${esc(e.name)} · ${esc(e.location)}</span></div></div>`).join('')||'<div class="empty">Sem atividades.</div>'}</div></div>`}
function manage(){if(role==='parent'){$('manage').innerHTML=`<div class="head"><div><h2>Informação</h2><p>A área de gestão é reservada à equipa técnica.</p></div></div><div class="card"><div class="empty">Muda o perfil para Coach ou Admin para gerir o clube.</div></div>`;return}const teamRows=Object.entries(data.teams).map(([k,v])=>`<tr><td><strong>${esc(k)}</strong></td><td>${esc(v.coach||'—')}</td><td>${(v.players||[]).length}</td><td>${(v.events||[]).filter(e=>e.type==='training').length}</td><td>${(v.events||[]).filter(e=>e.type==='match').length}</td><td><span class="status ok">Ativa</span></td></tr>`).join('');$('manage').innerHTML=`<div class="head"><div><h2>${t('manage')}</h2><p>${role==='admin'?'Controlo do clube e ferramentas de demonstração.':'Ferramentas da equipa.'}</p></div><div class="actions"><button class="btn" onclick="openPlayer()">+ ${t('newPlayer')}</button><button class="btn red" onclick="openEvent()">+ ${t('newEvent')}</button></div></div><div class="teamhero"><div class="head"><div><span class="kicker">EQUIPA ATUAL</span><h3>${esc(data.selected)}</h3><p>${esc(team().coach||'Sem treinador')} · ${esc(team().season)}</p></div><select class="select" onchange="selectTeam(this.value)">${Object.keys(data.teams).map(k=>`<option ${k===data.selected?'selected':''}>${esc(k)}</option>`).join('')}</select></div><div class="teammeta"><div><small>Jogadores</small><strong>${names().length}</strong></div><div><small>Treinos</small><strong>${(team().events||[]).filter(e=>e.type==='training').length}</strong></div><div><small>Jogos</small><strong>${(team().events||[]).filter(e=>e.type==='match').length}</strong></div><div><small>Presença</small><strong>${attendanceRate()}%</strong></div></div></div>${role==='admin'?`<div class="section card"><div class="head"><div><h3>Visão do clube</h3><p>Estado rápido de todas as equipas.</p></div></div><div class="tablewrap"><table class="table"><thead><tr><th>Equipa</th><th>Treinador</th><th>Jogadores</th><th>Treinos</th><th>Jogos</th><th>Estado</th></tr></thead><tbody>${teamRows}</tbody></table></div></div>`:''}<div class="section card"><div class="head"><div><h3>Jogadores — ${esc(data.selected)}</h3><p>Gerir plantel e perfis.</p></div></div><div class="playergrid">${names().map(x=>`<div class="player"><div class="left"><div class="photo">${initials(x.name)}</div><div><strong>${esc(x.name)}</strong><span class="muted">#${x.number} · ${esc(x.position||'Sem posição')}</span></div></div><button class="btn light small" onclick="openPlayer('${encodeURIComponent(x.name)}')">Editar</button></div>`).join('')}</div></div><div class="section card"><div class="head"><div><h3>Backup local</h3><p>Os dados desta demo ficam guardados neste dispositivo.</p></div></div><div class="actions"><button class="btn light" onclick="exportData()">↗ Exportar</button><button class="btn light" onclick="resetData()">Repor demo</button></div></div>`}
function teamPage(){const p=names(),ev=nextEvents();$('team').innerHTML=`<div class="teamhero"><div class="head"><div><span class="kicker">${t('team')}</span><h2>${esc(data.selected)}</h2><p>${esc(team().coach||'Sem treinador')} · ${esc(team().assistant||'Sem adjunto')} · ${esc(team().season)}</p></div><button class="btn light small" onclick="go('manage')">Gerir</button></div><div class="teammeta"><div><small>Plantel</small><strong>${p.length}</strong></div><div><small>Presença</small><strong>${attendanceRate()}%</strong></div><div><small>Próximo jogo</small><strong>${ev.find(e=>e.type==='match')?.time||'—'}</strong></div><div><small>Treino</small><strong>${ev.find(e=>e.type==='training')?.time||'—'}</strong></div></div></div><div class="tabs"><button class="active" onclick="teamTab(this,'tp')">Resumo</button><button onclick="teamTab(this,'players')">Jogadores</button><button onclick="teamTab(this,'events')">Atividades</button></div><div id="tp" class="tabpane active card"><div class="head"><div><h3>Próximos compromissos</h3><p>Agenda da equipa.</p></div></div>${ev.map(e=>`<div class="notice"><i>${e.type==='match'?'🏆':'⚽'}</i><div><strong>${esc(e.name)}${e.opponent?' · '+esc(e.opponent):''}</strong><span class="muted">${fmt(e.date)} · ${esc(e.time)} · ${esc(e.location)}</span></div></div>`).join('')||'<div class="empty">Sem atividades.</div>'}</div><div id="players" class="tabpane card"><div class="playergrid">${p.map(x=>`<div class="player"><div class="left"><div class="photo">${initials(x.name)}</div><div><strong>${esc(x.name)}</strong><span class="muted">#${x.number} · ${esc(x.position||'Sem posição')}</span></div></div></div>`).join('')}</div></div><div id="events" class="tabpane card"><div class="list">${ev.map(e=>`<div class="row"><div><strong>${esc(e.name)}</strong><div class="muted">${fmt(e.date)} · ${esc(e.time)} · ${esc(e.location)}</div></div><span class="badge ${e.type==='match'?'red':''}">${e.type==='match'?t('match'):t('training')}</span></div>`).join('')||'<div class="empty">Sem atividades.</div>'}</div></div>`}
function teamTab(btn,id){btn.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.tabpane').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}
function openPlayer(encoded=''){const old=encoded?decodeURIComponent(encoded):'';const x=names().find(p=>p.name===old)||{name:'',number:'',position:'',birthDate:'',guardian:'',phone:'',email:''};openModal(`<h2>${old?'Editar jogador':t('newPlayer')}</h2><form class="form" onsubmit="return savePlayer(event,'${encodeURIComponent(old)}')"><label>Nome<input id="pname" required value="${esc(x.name)}"></label><div class="two"><label>Número<input id="pnum" type="number" min="1" value="${esc(x.number)}"></label><label>Posição<input id="ppos" value="${esc(x.position)}"></label></div><div class="two"><label>Data nascimento<input id="pbirth" type="date" value="${esc(x.birthDate||'')}"></label><label>Telefone<input id="pphone" value="${esc(x.phone||'')}"></label></div><label>Pai / Mãe / Encarregado<input id="pguardian" value="${esc(x.guardian||'')}"></label><label>Email<input id="pemail" type="email" value="${esc(x.email||'')}"></label><div class="actions"><button class="btn light" type="button" onclick="closeModal()">${t('cancel')}</button><button class="btn red" type="submit">${t('save')}</button></div></form>`)}
function savePlayer(e,encoded){e.preventDefault();const old=encoded?decodeURIComponent(encoded):'';const obj={name:$('pname').value.trim(),number:Number($('pnum').value)||1,position:$('ppos').value.trim(),birthDate:$('pbirth').value,phone:$('pphone').value.trim(),guardian:$('pguardian').value.trim(),email:$('pemail').value.trim(),active:true};if(!obj.name)return false;const arr=team().players;const idx=arr.findIndex(p=>(typeof p==='string'?p:p.name)===old);if(idx>=0)arr[idx]=obj;else arr.push(obj);save();closeModal();render();toast('Jogador guardado ✓');return false}
function openEvent(){openModal(`<h2>${t('newEvent')}</h2><form class="form" onsubmit="return saveEvent(event)"><label>Tipo<select id="etype"><option value="training">${t('training')}</option><option value="match">${t('match')}</option></select></label><label>Nome<input id="ename" required placeholder="Ex.: Treino U9"></label><div class="two"><label>Data<input id="edate" type="date" required value="${isoToday()}"></label><label>Hora<input id="etime" type="time" value="18:30"></label></div><label>Local<input id="elocation" value="Campo Municipal 2"></label><label>Adversário (jogo)<input id="eopp" placeholder="Ex.: Racing FC"></label><div class="actions"><button class="btn light" type="button" onclick="closeModal()">${t('cancel')}</button><button class="btn red" type="submit">${t('save')}</button></div></form>`)}function saveEvent(e){e.preventDefault();team().events.push({id:'e'+Date.now(),type:$('etype').value,name:$('ename').value.trim(),date:$('edate').value,time:$('etime').value,location:$('elocation').value.trim(),opponent:$('eopp').value.trim()});save();closeModal();render();toast('Evento guardado ✓');return false}function removeEvent(id){team().events=team().events.filter(e=>e.id!==id);save();render();toast('Evento apagado')}function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='clubgest-backup.json';a.click();URL.revokeObjectURL(a.href)}function resetData(){if(!confirm('Repor os dados demo?'))return;data=JSON.parse(JSON.stringify(seed));save();render();toast('Demo reposta')}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js?v=12').catch(()=>{}));
function render(){document.documentElement.lang=lang;$('role').value=role;$('lang').value=lang;$('todayDate').textContent=new Intl.DateTimeFormat(lang==='pt'?'pt-PT':lang,{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(new Date());$('todayTeam').textContent=data.selected;$('n-man').style.display=role==='parent'?'none':'';$('n-team').style.display='';home();attendance();calendar();manage();teamPage()}render();
</script>

<body>
<div class="app">
<header class="top"><div class="topin"><div class="brand"><div class="crest" aria-label="ClubGest">CG</div><div><span class="cg-title">CLUBGEST</span><small>FCD03 Differdange · U7 · U9 · U11</small></div></div><select id="role" class="select" onchange="setRole(this.value)"><option value="parent">👨‍👩‍👧 Parent</option><option value="coach">⚽ Coach</option><option value="admin">🛠 Admin</option></select><select id="lang" class="select" onchange="setLang(this.value)"><option value="pt">PT</option><option value="fr">FR</option><option value="en">EN</option></select></div></header>
<main class="main"><div class="today"><div><small>CLUBGEST</small><strong id="todayDate">Hoje</strong></div><div class="badges"><span class="badge" id="todayTeam">U9</span><span class="badge green" id="todayStatus">Sistema ativo</span></div></div><section id="home" class="screen active"></section><section id="attendance" class="screen"></section><section id="calendar" class="screen"></section><section id="manage" class="screen"></section><section id="team" class="screen"></section></main>
<nav class="nav"><div class="navin"><button id="n-home" onclick="go('home')" class="active"><span>⌂</span>Início</button><button id="n-att" onclick="go('attendance')"><span>✓</span>Presenças</button><button id="n-cal" onclick="go('calendar')"><span>▣</span>Calendário</button><button id="n-man" onclick="go('manage')"><span>⚙</span>Gestão</button><button id="n-team" onclick="go('team')"><span>CG</span>Equipa</button></div></nav></div>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div><div id="toast" class="toast"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);const KEY='clubgest_v3';
const I18N={pt:{welcome:'Bom trabalho. Vamos avançar.',parent:'Encarregado',coach:'Treinador',admin:'Administrador',players:'Jogadores',trainings:'Treinos',games:'Jogos',attendance:'Presenças',calendar:'Calendário',manage:'Gestão',next:'Próximas atividades',training:'Treino',match:'Jogo',present:'Presente',absent:'Ausente',pending:'Pendente',save:'Guardar',cancel:'Cancelar',newPlayer:'Novo jogador',newEvent:'Novo evento',team:'Equipa',overview:'Resumo',noData:'Sem dados ainda.',today:'Hoje',confirm:'Confirmar',confirmed:'Confirmado',planning:'Planeamento',communication:'Comunicação'},fr:{welcome:'Bon travail. On avance.',parent:'Parent',coach:'Entraîneur',admin:'Administrateur',players:'Joueurs',trainings:'Entraînements',games:'Matchs',attendance:'Présences',calendar:'Calendrier',manage:'Gestion',next:'Prochaines activités',training:'Entraînement',match:'Match',present:'Présent',absent:'Absent',pending:'En attente',save:'Enregistrer',cancel:'Annuler',newPlayer:'Nouveau joueur',newEvent:'Nouvel événement',team:'Équipe',overview:'Résumé',noData:'Pas encore de données.',today:"Aujourd’hui",confirm:'Confirmer',confirmed:'Confirmé',planning:'Planification',communication:'Communication'},en:{welcome:'Good work. Let’s move forward.',parent:'Parent',coach:'Coach',admin:'Administrator',players:'Players',trainings:'Trainings',games:'Games',attendance:'Attendance',calendar:'Calendar',manage:'Management',next:'Upcoming activities',training:'Training',match:'Match',present:'Present',absent:'Absent',pending:'Pending',save:'Save',cancel:'Cancel',newPlayer:'New player',newEvent:'New event',team:'Team',overview:'Overview',noData:'No data yet.',today:'Today',confirm:'Confirm',confirmed:'Confirmed',planning:'Planning',communication:'Communication'}};
const seed={selected:'U9',teams:{U7:{name:'U7',season:'2026/2027',coach:'Coach U7',players:[{name:'Arthur Mendes',birth:'2019-02-14',pos:'Ala'},{name:'Lucas Pinto',birth:'2019-07-21',pos:'Guarda-redes'},{name:'Noah Martins',birth:'2019-11-02',pos:'Ala'},{name:'Tiago Silva',birth:'2019-05-09',pos:'Defesa'}]},U9:{name:'U9',season:'2026/2027',coach:'Coach U9',players:[{name:'Diogo Teixeira',birth:'2017-03-12',pos:'Ala'},{name:'Tomás Alves',birth:'2017-06-08',pos:'Guarda-redes'},{name:'Mateus Costa',birth:'2017-09-22',pos:'Defesa'},{name:'Rafael Sousa',birth:'2017-12-03',pos:'Ala'},{name:'Gonçalo Pereira',birth:'2017-01-27',pos:'Avançado'}]},U11:{name:'U11',season:'2026/2027',coach:'Coach U11',players:[{name:'Martim Ferreira',birth:'2015-04-11',pos:'Ala'},{name:'Evan Lopes',birth:'2015-08-19',pos:'Defesa'},{name:'Duarte Ramos',birth:'2015-10-05',pos:'Avançado'},{name:'Samuel Dias',birth:'2015-12-17',pos:'Guarda-redes'}]}},attendance:{},events:[{type:'training',team:'U9',date:'2026-09-03',time:'18:00',title:'Treino U9',location:'FCD03'},{type:'training',team:'U9',date:'2026-09-05',time:'10:00',title:'Treino U9',location:'FCD03'},{type:'match',team:'U9',date:'2026-09-06',time:'11:30',title:'Jogo U9',location:'Differdange'}]};
function read(){try{const obj=JSON.parse(localStorage.getItem(KEY)||'null');if(!obj||!obj.teams||typeof obj.teams!=='object'||!obj.attendance||typeof obj.attendance!=='object'||!obj.selected||!obj.teams[obj.selected])return null;return obj}catch(e){return null}}
let data=read()||JSON.parse(JSON.stringify(seed));
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function team(){return(data.teams&&data.teams[data.selected])||(data.teams&&data.teams.U9)||seed.teams.U9}
function lang(){return localStorage.getItem('cgLang')||'pt'}function t(k){return(I18N[lang()]||I18N.pt)[k]||I18N.pt[k]||k}
function setLang(v){localStorage.setItem('cgLang',v);render()}
function setRole(v){localStorage.setItem('cgRole',v);localStorage.setItem('cgOnboarded','1');render()}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),1800)}
function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c))}
function dateLabel(s){try{return new Intl.DateTimeFormat(lang(),{weekday:'short',day:'2-digit',month:'2-digit'}).format(new Date(s+'T12:00:00'))}catch(e){return s}}
function initials(n){return String(n||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));const map={home:'n-home',attendance:'n-att',calendar:'n-cal',manage:'n-man',team:'n-team'};$(map[id])?.classList.add('active');renderScreen(id);window.scrollTo({top:0,behavior:'smooth'})}
function render(){const r=localStorage.getItem('cgRole')||'parent';if($('role'))$('role').value=r;if($('lang'))$('lang').value=lang();$('todayTeam').textContent=team().name;$('todayDate').textContent=new Intl.DateTimeFormat(lang(),{dateStyle:'full'}).format(new Date());renderScreen(document.querySelector('.screen.active')?.id||'home')}
function renderScreen(id){if(id==='home')renderHome();if(id==='attendance')renderAttendance();if(id==='calendar')renderCalendar();if(id==='manage')renderManage();if(id==='team')renderTeam()}
function renderHome(){const el=$('home'),tm=team(),up=[...(data.events||[])].filter(e=>e.team===tm.name).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,3);const total=tm.players.length;const present=tm.players.filter(p=>(data.attendance[tm.name+'|'+p.name]||'pending')==='present').length;el.innerHTML=`<div class="hero"><div><span class="kicker">FC DÉIFFERDENG 03 · CLUBGEST</span><h1>${t('welcome')}</h1><p>${t('team')} ${tm.name} · ${tm.season}</p></div><div class="crest" aria-hidden="true">CG</div></div><div class="grid"><div class="card stat"><small>${t('players')}</small><strong>${total}</strong></div><div class="card stat"><small>${t('trainings')}</small><strong>${(data.events||[]).filter(e=>e.team===tm.name&&e.type==='training').length}</strong></div><div class="card stat"><small>${t('games')}</small><strong>${(data.events||[]).filter(e=>e.team===tm.name&&e.type==='match').length}</strong></div><div class="card stat"><small>${t('attendance')}</small><strong>${total?Math.round(present*100/total):0}%</strong></div></div><section class="section"><div class="head"><div><h2>${t('next')}</h2><p>${t('team')} ${tm.name}</p></div><div class="actions"><button class="btn small" onclick="go('calendar')">${t('calendar')}</button><button class="btn red small" onclick="go('attendance')">${t('attendance')}</button></div></div><div class="list">${up.length?up.map(e=>`<div class="row"><div class="left"><div class="avatar">${e.type==='match'?'⚽':'▣'}</div><div><strong>${esc(e.title)}</strong><span class="muted">${dateLabel(e.date)} · ${e.time} · ${esc(e.location||'')}</span></div></div><span class="badge ${e.type==='match'?'red':'dark'}">${e.type==='match'?t('match'):t('training')}</span></div>`).join(''):`<div class="empty">${t('noData')}</div>`}</div></section>`}
function setAttendance(name,status){data.attendance=data.attendance&&typeof data.attendance==='object'?data.attendance:{};data.attendance[data.selected+'|'+name]=status;save();render();toast(t('save')+' ✓')}
function renderAttendance(){const el=$('attendance'),tm=team();el.innerHTML=`<div class="head"><div><h2>${t('attendance')} · ${tm.name}</h2><p>${tm.coach}</p></div><span class="badge dark">${tm.players.length} ${t('players')}</span></div><div class="list">${tm.players.map(p=>{const s=data.attendance[tm.name+'|'+p.name]||'pending';return `<div class="row"><div class="left"><div class="avatar">${initials(p.name)}</div><div><strong>${esc(p.name)}</strong><span class="muted">${esc(p.pos||'')} · ${p.birth||''}</span></div></div><div class="choice"><button class="${s==='present'?'yes active':''}" onclick="setAttendance('${esc(p.name)}','present')">✓</button><button class="${s==='absent'?'no active':''}" onclick="setAttendance('${esc(p.name)}','absent')">×</button></div></div>`}).join('')}</div>`}
function renderCalendar(){const el=$('calendar'),tm=team(),ev=[...(data.events||[])].filter(e=>e.team===tm.name).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));el.innerHTML=`<div class="head"><div><h2>${t('calendar')}</h2><p>${t('team')} ${tm.name}</p></div><button class="btn red small" onclick="openEventForm()">+ ${t('newEvent')}</button></div><div class="list">${ev.map(e=>`<div class="row"><div class="left"><div class="avatar">${e.type==='match'?'⚽':'▣'}</div><div><strong>${esc(e.title)}</strong><span class="muted">${dateLabel(e.date)} · ${e.time} · ${esc(e.location||'')}</span></div></div><span class="status ${e.type==='match'?'bad':'ok'}">${e.type==='match'?t('match'):t('training')}</span></div>`).join('')||`<div class="empty">${t('noData')}</div>`}</div>`}
function renderTeam(){const el=$('team'),tm=team();el.innerHTML=`<div class="teamhero"><div class="head"><div><span class="kicker">FC DÉIFFERDENG 03</span><h2>${tm.name}</h2><p>${tm.season} · ${tm.coach}</p></div><button class="btn small" onclick="openPlayerForm()">+ ${t('newPlayer')}</button></div><div class="teammeta"><div><small>${t('players')}</small><strong>${tm.players.length}</strong></div><div><small>${t('trainings')}</small><strong>${(data.events||[]).filter(e=>e.team===tm.name&&e.type==='training').length}</strong></div><div><small>${t('games')}</small><strong>${(data.events||[]).filter(e=>e.team===tm.name&&e.type==='match').length}</strong></div><div><small>${t('attendance')}</small><strong>${Math.round(tm.players.filter(p=>(data.attendance[tm.name+'|'+p.name]||'pending')==='present').length*100/Math.max(1,tm.players.length))}%</strong></div></div></div><div class="playergrid">${tm.players.map(p=>`<div class="player"><div class="left"><div class="photo">${initials(p.name)}</div><div><strong>${esc(p.name)}</strong><span class="muted">${esc(p.pos||'')}</span></div></div><span class="badge">${p.birth||'—'}</span></div>`).join('')}</div>`}
function renderManage(){const el=$('manage'),r=localStorage.getItem('cgRole')||'parent';el.innerHTML=`<div class="head"><div><h2>${t('manage')}</h2><p>${r==='admin'?t('admin'):r==='coach'?t('coach'):t('parent')}</p></div></div><div class="featuregrid"><div class="feature"><div class="icon">📅</div><h3>${t('planning')}</h3><p>${t('calendar')} e atividades da equipa.</p></div><div class="feature"><div class="icon">📣</div><h3>${t('communication')}</h3><p>Preparado para avisos e mensagens do clube.</p></div><div class="feature"><div class="icon">🔐</div><h3>Acesso</h3><p>Coaches e admins entram apenas após aprovação.</p></div></div>`}
function openPlayerForm(){const tm=team();$('sheet').innerHTML=`<h2>${t('newPlayer')}</h2><div class="form"><label>Nome<input id="pname"></label><label>Data de nascimento<input id="pbirth" type="date"></label><label>Posição<input id="ppos" placeholder="Ala, Defesa…"></label></div><div class="actions" style="margin-top:14px"><button class="btn light" onclick="closeModal()">${t('cancel')}</button><button class="btn red" onclick="addPlayer()">${t('save')}</button></div>`;$('modal').classList.add('show')}
function addPlayer(){const n=($('pname').value||'').trim();if(!n){toast('Nome obrigatório');return}team().players.push({name:n,birth:$('pbirth').value||'',pos:($('ppos').value||'').trim()});save();closeModal();render();toast(t('save')+' ✓')}
function openEventForm(){$('sheet').innerHTML=`<h2>${t('newEvent')}</h2><div class="form"><label>Tipo<select id="etype"><option value="training">${t('training')}</option><option value="match">${t('match')}</option></select></label><label>Título<input id="etitle" placeholder="Treino U9"></label><label>Data<input id="edate" type="date"></label><label>Hora<input id="etime" type="time"></label><label>Local<input id="eloc" placeholder="FCD03"></label></div><div class="actions" style="margin-top:14px"><button class="btn light" onclick="closeModal()">${t('cancel')}</button><button class="btn red" onclick="addEvent()">${t('save')}</button></div>`;$('modal').classList.add('show')}
function addEvent(){const title=($('etitle').value||'').trim(),date=$('edate').value;if(!title||!date){toast('Título e data obrigatórios');return}data.events.push({type:$('etype').value,team:team().name,date,time:$('etime').value||'18:00',title,location:($('eloc').value||'').trim()});data.events.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));save();closeModal();render();toast(t('save')+' ✓')}
function closeModal(){$('modal').classList.remove('show');$('sheet').innerHTML=''}
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
function boot(){render();if(window.ClubGestData)window.ClubGestData.club().catch(()=>{})}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script>
